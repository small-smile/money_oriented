# money_oriented 测试环境 —— 系统 nginx 的 vhost（需 root）
#
# 装法：
#   sudo ln -sf /home/zhu/Desktop/real_home/code/python/money_oriented/deploy/nginx/money_oriented.conf \
#               /usr/local/nginx/conf/vhost/money_oriented.conf
#   sudo /usr/local/nginx/sbin/nginx -t && sudo systemctl reload nginx
# 访问：http://localhost/  （不用改 hosts；nginx.conf 里那个 default_server 在 81 端口，不冲突）
#
# 页面里的接口一律是相对路径 /api/...，所以只要页面和接口同源，
# 整站直接反代给 Flask（backend_python.py 监听 5000）即可；
# 静态页也走 Flask，因为 company/bank/*.html 需要后端注入 window.COMPANY_CODE。
#
# 只监听 127.0.0.1：这套服务没有任何鉴权，不要暴露到局域网。

server {
    listen 127.0.0.1:80 default_server;
    server_name localhost;

    access_log /home/wwwlogs/money_oriented.access.log;
    error_log  /home/wwwlogs/money_oriented.error.log;

    # 后端首次拼图表数据（读 data/tables/*.json）可能偏慢，超时给宽一点
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
