# money_oriented 测试环境 —— 系统 nginx 的 vhost（需 root）
#
# 装法：
#   sudo ln -sf /home/zhu/Desktop/real_home/code/python/money_oriented/deploy/nginx/money_oriented.conf \
#               /usr/local/nginx/conf/vhost/money_oriented.conf
#   sudo /usr/local/nginx/sbin/nginx -t && sudo systemctl reload nginx
# 访问：http://localhost/  （nginx.conf 里那个 default_server 在 81 端口，不冲突）
#
# 前后端分离后：
#   - 前端是 Vite 打出来的静态站（frontend/dist），nginx 直接发；SPA 路由用 try_files 兜底到 index.html。
#     打包：cd frontend && npm run build
#   - 接口是纯 JSON 的 Flask（app.py 监听 5000），只反代 /api/。
#   - cmcc 页直接 fetch /data/tables/*.json，用 alias 指到仓库 data/（权威源，避免打包时拷贝整个 data/）。
#
# 只监听 127.0.0.1：这套服务没有任何鉴权，不要暴露到局域网。

server {
    listen 127.0.0.1:80 default_server;
    server_name localhost;

    access_log /home/wwwlogs/money_oriented.access.log;
    error_log  /home/wwwlogs/money_oriented.error.log;

    root /home/zhu/Desktop/real_home/code/python/money_oriented/frontend/dist;
    index index.html;

    # 纯 JSON 接口反代给 Flask；首次拼图表数据（读 data/tables/*.json）可能偏慢，超时给宽一点
    location /api/ {
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # cmcc 页直接取仓库里的数据表
    location /data/ {
        alias /home/zhu/Desktop/real_home/code/python/money_oriented/data/;
    }

    # Vue SPA：静态资源命中就发，否则回落到 index.html 交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
