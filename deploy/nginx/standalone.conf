# money_oriented 测试环境 —— 免 root 的独立 nginx 实例（监听 127.0.0.1:8080）
#
# 起停（不需要 sudo，日志/pid 都落在 ~/.local/share/nginx-money/）：
#   nginx -c /home/zhu/Desktop/real_home/code/python/money_oriented/deploy/nginx/standalone.conf
#   nginx -c .../standalone.conf -s reload
#   nginx -c .../standalone.conf -s quit
# 访问：http://money.local:8080/ 或 http://127.0.0.1:8080/
#
# 系统 nginx（80 端口、无端口号访问）用同目录的 money_oriented.conf，那个要 root。

worker_processes 1;
daemon on;

error_log /home/zhu/.local/share/nginx-money/logs/error.log warn;
pid       /home/zhu/.local/share/nginx-money/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;

    access_log /home/zhu/.local/share/nginx-money/logs/access.log;

    client_body_temp_path /home/zhu/.local/share/nginx-money/temp/client_body;
    proxy_temp_path       /home/zhu/.local/share/nginx-money/temp/proxy;
    fastcgi_temp_path     /home/zhu/.local/share/nginx-money/temp/fastcgi;
    uwsgi_temp_path       /home/zhu/.local/share/nginx-money/temp/uwsgi;
    scgi_temp_path        /home/zhu/.local/share/nginx-money/temp/scgi;

    sendfile on;
    keepalive_timeout 60;

    server {
        listen 127.0.0.1:8080;
        server_name money.local localhost;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
