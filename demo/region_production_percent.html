<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>各地区石油产量占比（1965-2024）</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f5f7fa;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        #chart-stack { width: 100%; flex: 1 1 0; min-height: 0; }
        #detail-wrap {
            width: 100%; flex: 0 0 220px;
            background: #fff; border-top: 2px solid #ddd;
            display: flex; flex-direction: column;
        }
        #detail-title {
            text-align: center; font-size: 13px; color: #333;
            height: 20px; line-height: 20px; padding-top: 3px;
        }
        #chart-detail { width: 100%; height: 200px; }
        #loading { text-align: center; padding: 60px; color: #666; font-size: 15px; }
        #error-msg { display: none; text-align: center; padding: 20px; color: #d32f2f; font-size: 14px; }
    </style>
</head>
<body>
<div id="loading">数据加载中...</div>
<div id="error-msg"></div>
<div id="chart-stack" style="display:none"></div>
<div id="detail-wrap">
    <div id="detail-title">—</div>
    <div id="chart-detail"></div>
</div>
<script>
const REGION_COLORS = {
    'North America':      '#5470c6',
    'CIS':                '#fac858',
    'Middle East':        '#ee6666',
    'S. & Cent. America': '#91cc75',
    'Africa':             '#fc8452',
    'Asia Pacific':       '#73c0de',
    'Europe':             '#9a60b4'
};

function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error-msg');
    el.style.display = 'block';
    el.textContent = '加载失败：' + msg + '（请确保 Flask 后端已启动）';
}

let _years, _regionData, _pctData;
let detailChart = null;
let currentRegion = null;

axios.get('http://127.0.0.1:5000/api/production_region')
    .then(res => {
        if (res.data.code !== 200) { showError(res.data.msg || '未知错误'); return; }
        const d = res.data.data;
        _years = d.years;
        _regionData = d.region_data;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('chart-stack').style.display = 'block';
        render(d.years, d.region_data);
        const first = Object.keys(d.region_data).sort((a, b) => {
            const ca = d.region_data[a][d.region_data[a].length-1] - d.region_data[a][0];
            const cb = d.region_data[b][d.region_data[b].length-1] - d.region_data[b][0];
            return ca - cb;
        })[0];
        currentRegion = first;
        showDetail(first);
    })
    .catch(err => showError(err.message));

function render(years, regionData) {
    const chart = echarts.init(document.getElementById('chart-stack'));

    // 减少在下，增加在上
    const regions = Object.keys(regionData).sort((a, b) => {
        const ca = regionData[a][regionData[a].length - 1] - regionData[a][0];
        const cb = regionData[b][regionData[b].length - 1] - regionData[b][0];
        return ca - cb;
    });

    const totals = years.map((_, yi) =>
        regions.reduce((s, r) => s + (regionData[r][yi] || 0), 0)
    );
    _pctData = {};
    regions.forEach(r => {
        _pctData[r] = regionData[r].map((v, yi) =>
            totals[yi] > 0 ? parseFloat(((v / totals[yi]) * 100).toFixed(2)) : 0
        );
    });

    chart.setOption({
        backgroundColor: '#ffffff',
        title: {
            text: '各地区石油产量占比（百分比堆叠，1965-2024）',
            subtext: '悬浮到某层查看该地区独立走势',
            left: 'center', top: 8,
            textStyle: { color: '#1a1a2e', fontSize: 15 },
            subtextStyle: { color: '#666', fontSize: 12 }
        },
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross', lineStyle: { width: 2 } },
            position: [12, 12],
            formatter: params => {
                let html = `<b>${params[0].axisValue} 年</b><br>`;
                params.slice().reverse().forEach(p => {
                    const bold = p.seriesName === currentRegion;
                    html += `${p.marker}${bold ? '<b>' : ''}${p.seriesName}: ${(p.value||0).toFixed(1)}%${bold ? ' ←</b>' : ''}<br>`;
                });
                return html;
            }
        },
        legend: {
            data: regions, top: 56, type: 'scroll',
            textStyle: { color: '#333', fontSize: 12 },
            formatter: name => {
                const d = _pctData[name];
                const diff = (d[d.length - 1] - d[0]).toFixed(1);
                const sign = diff >= 0 ? '+' : '';
                return `${name}  (${sign}${diff}%)`;
            }
        },
        grid: { left: 56, right: 20, top: 100, bottom: 60 },
        toolbox: { feature: { saveAsImage: {}, dataZoom: { yAxisIndex: 'none' }, restore: {} }, right: 10, top: 8 },
        dataZoom: [
            { type: 'slider', xAxisIndex: 0, bottom: 8, height: 20 },
            { type: 'inside', xAxisIndex: 0 }
        ],
        xAxis: {
            type: 'category', data: years, boundaryGap: false,
            axisLabel: { color: '#555' }, axisLine: { lineStyle: { color: '#bbb' } }
        },
        yAxis: {
            type: 'value', name: '%', min: 0, max: 100,
            nameTextStyle: { color: '#555' },
            axisLabel: { color: '#555', formatter: v => v + '%' },
            splitLine: { lineStyle: { color: '#e8e8e8' } }
        },
        series: regions.map(r => ({
            name: r, type: 'line', stack: 'total',
            areaStyle: { opacity: 0.75 }, emphasis: { focus: 'series' },
            smooth: true, showSymbol: false,
            data: _pctData[r], color: REGION_COLORS[r]
        }))
    });

    const chartDom = document.getElementById('chart-stack');
    chartDom.addEventListener('mousemove', e => {
        const rect = chartDom.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;
        const dataCoord = chart.convertFromPixel('grid', [px, py]);
        if (!dataCoord) return;
        const xi = Math.round(dataCoord[0]);
        if (xi < 0 || xi >= years.length) return;
        let cum = 0, hit = null;
        for (const r of regions) {
            const val = _pctData[r][xi] || 0;
            const prevCum = cum;
            cum += val;
            const botPx = chart.convertToPixel('grid', [xi, prevCum])[1];
            const topPx = chart.convertToPixel('grid', [xi, cum])[1];
            if (py >= topPx && py <= botPx) { hit = r; break; }
        }
        if (hit && hit !== currentRegion) {
            currentRegion = hit;
            showDetail(hit);
        }
    });

    window.addEventListener('resize', () => { chart.resize(); if (detailChart) detailChart.resize(); });
    new ResizeObserver(() => chart.resize()).observe(chartDom);
}

function showDetail(region) {
    document.getElementById('detail-title').textContent =
        `${region} — 独立产量走势（千桶/日）`;
    if (!detailChart) detailChart = echarts.init(document.getElementById('chart-detail'));
    const color = REGION_COLORS[region] || '#5470c6';
    detailChart.setOption({
        backgroundColor: '#fafafa',
        tooltip: { trigger: 'axis', axisPointer: { type: 'cross', lineStyle: { width: 1 } } },
        grid: { left: 56, right: 16, top: 12, bottom: 40 },
        dataZoom: [{ type: 'inside', xAxisIndex: 0 }],
        xAxis: {
            type: 'category', data: _years, boundaryGap: false,
            axisLabel: { color: '#555', fontSize: 10 }, axisLine: { lineStyle: { color: '#bbb' } }
        },
        yAxis: {
            type: 'value',
            axisLabel: { color: '#555', fontSize: 10, formatter: v => (v/1000).toFixed(0) + 'k' },
            splitLine: { lineStyle: { color: '#eee' } }
        },
        series: [{
            type: 'line', data: _regionData[region],
            smooth: true, showSymbol: false,
            areaStyle: { color, opacity: 0.15 },
            lineStyle: { color, width: 2 }, itemStyle: { color }
        }]
    }, true);
}
</script>
</body>
</html>
