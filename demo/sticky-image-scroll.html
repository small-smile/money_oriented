<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滚动改变高度比例 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
    background: #f5f5f7;
  }

  /* 滚动区:高度决定动画持续多长(越高滚得越久) */
  .scroller { height: 300vh; }

  /* sticky 舞台:两个长方形在这一屏里随滚动变高 */
  .stage {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 12px;
    align-items: flex-start;     /* 左对齐:宽度变化时左边距不动,从右侧收缩 */
  }

  .box {
    width: 100%;                 /* 等宽 */
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    /* 宽/高都用 JS 按滚动进度设置;这里给个过渡让手感更顺 */
    transition: width .12s linear, height .12s linear;
  }
  #top    { height: 80%; width: 100%; background: #0a84ff; }
  #bottom { height: 20%; width: 100%; background: #34c759; }

  .hint {
    position: fixed; left: 16px; bottom: 16px;
    background: rgba(0,0,0,.75); color: #fff;
    font-size: 12px; padding: 6px 12px; border-radius: 20px;
  }
</style>
</head>
<body>

<div class="scroller">
  <div class="stage">
    <div class="box" id="top">上 · <span class="pct">80</span>%</div>
    <div class="box" id="bottom">下 · <span class="pct">20</span>%</div>
  </div>

</div>
<div class="stage" height="1000px"></div>

<div class="hint">向下滚动:上块由高变矮,下块由矮变高</div>

<script>
  const scroller = document.querySelector('.scroller');
  const stage    = document.querySelector('.stage');
  const topEl    = document.getElementById('top');   // 不能叫 top:会和 window.top 冲突,导致整段脚本报 SyntaxError
  const botEl    = document.getElementById('bottom');
  const topPct   = topEl.querySelector('.pct');
  const botPct   = botEl.querySelector('.pct');

  // top 宽/高同时缩小,左上角不动(width 靠 align-items: flex-start 从右侧收,height 从底部收)
  const W_START = 100, W_RANGE = 70;   // 宽 100% → 30%
  const H_START = 80,  H_RANGE = 60;   // 高 80%  → 20%
  // bottom 高度增长
  const B_START = 20,  B_RANGE = 60;   // 高 20%  → 80%

  function update() {
    // 滚动进度 0→1:scroller 顶部滚过的距离 / (scroller 高 - 一屏)
    const scrolled = -scroller.getBoundingClientRect().top;
    const total = scroller.offsetHeight - stage.offsetHeight;
    const p = Math.min(1, Math.max(0, scrolled / total));

    const topW = W_START - W_RANGE * p;   // 100 → 40
    const topH = H_START - H_RANGE * p;   // 80  → 20
    const botH = B_START + B_RANGE * p;   // 20  → 80

    topEl.style.width  = topW + '%';
    topEl.style.height = topH + '%';
    botEl.style.height = botH + '%';
    topPct.textContent = Math.round(topW) + '×' + Math.round(topH);
    botPct.textContent = Math.round(botH);
  }

  document.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
</script>

</body>
</html>
