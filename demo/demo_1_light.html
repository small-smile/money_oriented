<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>原油K线图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>#main {
        width: 100%;
        height: 800px;
    }</style>
</head>
<body>
<div id="main"></div>
<script>
    const chartDom = document.getElementById('main');
    const myChart = echarts.init(chartDom);

    // 三个请求promise
    const reqPrice = axios.get('http://127.0.0.1:5000/api/price');
    const reqProd = axios.get('http://127.0.0.1:5000/api/production');
    const reqAdj = axios.get('http://127.0.0.1:5000/api/adj_price');

    // 并发同时发起请求
    Promise.all([reqPrice, reqProd, reqAdj])
        .then(([resPrice, resProd, resAdj]) => {
            // 分别取出各接口返回
            const priceData = resPrice.data;
            const prodData = resProd.data;
            const adjData = resAdj.data;

            // 校验状态
            if (priceData.code !== 200) throw new Error("油价接口异常");
            if (prodData.code !== 200) throw new Error("产量接口异常");
            if (adjData.code !== 200) throw new Error("调整价接口异常");

            const {xAxis, candleData} = priceData.data;
            const {xAxis: prodXAxis, prodData: rawProd} = prodData.data;
            // 调整后油价折线数组
            const lineAdj = adjData.data.candleData;

            // 将产量数据对齐到价格 xAxis：前面补 null
            const priceStartIdx = xAxis.indexOf(prodXAxis[0]);
            const alignedProd = new Array(Math.max(priceStartIdx, 0)).fill(null).concat(rawProd);

            // 下面直接写option渲染多系列图表
            const option = {
                title: {text: "原油K线+多条折线"},
                tooltip: {
                    trigger: "axis",
                    axisPointer: {type: "cross"},
                    position: function (point) {
                        const chartWidth = chartDom.offsetWidth;
                        if (point[0] < chartWidth / 2) {
                            return ['60%', '10%'];
                        } else {
                            return ['5%', '10%'];
                        }
                    },
                    formatter: function (params) {
                        console.log(params)
                        let html = params[0].axisValue + '<br/>';
                        params.forEach(p => {
                            const d = p.data;
                            if (d == null) return;
                            if (p.seriesType === 'candlestick') {
                                const arr = Array.isArray(d) ? d : d.value;
                                html += p.marker + p.seriesName
                                    + '&nbsp;&nbsp;开: <b>' + arr[0] + '</b>'
                                    + '&nbsp;&nbsp;收: <b>' + arr[1] + '</b><br/>';
                            } else {
                                html += p.marker + p.seriesName
                                    + '&nbsp;&nbsp;<b>' + d + '</b><br/>';
                            }
                        });
                        return html;
                    }
                },
                legend: {data: ["原油K线", "通胀后油价", "年产量",]},
                xAxis: [
                    {type: "category", data: xAxis, axisLabel: {rotate: 45}},
                ],
                yAxis: [
                    {type: "value", name: "价格", scale: true},
                    {type: "value", name: "产量", scale: true},
                    {
                        type: "value", name: "2024平價價格", scale: true,
                        offset: 50,
                        axisLabel: {margin: 8},
                        position: 'left',
                    },
                ],
                dataZoom: [
                    // {type: "slider", xAxisIndex: 0},
                    {type: "inside", xAxisIndex: 0}
                ],
                series: [
                    {
                        name: "原油K线",
                        type: "candlestick",
                        yAxisIndex: 0,
                        data: candleData,
                        itemStyle: {
                            color: "#ef4444",
                            color0: "#16a34a",
                            borderColor: "#dc2626",
                            borderColor0: "#15803d"
                        }
                    },

                    {
                        name: "通胀后油价",
                        type: "candlestick",
                        yAxisIndex: 1,
                        data: lineAdj,
                        smooth: true,
                        symbol: "none",
                        itemStyle: {
                            color: "#7dd3fc",
                            color0: "#ffffff",
                            borderColor: "#0284c7",
                            borderColor0: "#3b82f6"
                        },
                    },
                    {
                        name: "年产量",
                        type: "line",
                        yAxisIndex: 2,
                        data: alignedProd,
                        barWidth: '60%',
                        itemStyle: {color: 'rgba(22, 163, 74, 0.5)'}
                    },

                ]
            };
            myChart.setOption(option);
            window.addEventListener('resize', () => myChart.resize());
        })
        .catch(err => {
            console.error(err);
            alert("接口请求失败，请检查后端服务");
        });
</script>
</body>
</html>
