<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="common/base.css">
    <script src="common/site-header.js" defer></script>
    <title>各洲石油产量对比：2001 vs 2024（面积图）</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f5f7fa; font-family: Arial, "Microsoft YaHei", sans-serif; }
        #loading { text-align: center; padding: 60px; color: #666; font-size: 15px; }
        #error-msg { display: none; text-align: center; padding: 20px; color: #d32f2f; font-size: 14px; }
        .chart-block { width: 100%; }
        .top-note {
            padding: 12px 20px 4px; font-size: 12px; color: #555; line-height: 1.6;
        }
    </style>
</head>
<body>
<div id="loading">数据加载中...</div>
<div id="error-msg"></div>
<div id="container"></div>

<script>
/* 洲主色（与 country_change_2001_vs_2024.html 保持一致） */
const CONT_COLOR = {
    'Africa':             '#fc8452',
    'Asia Pacific':       '#73c0de',
    'CIS':                '#fac858',
    'Europe':             '#9a60b4',
    'Middle East':        '#ee6666',
    'North America':      '#5470c6',
    'S. & Cent. America': '#91cc75'
};

/* 将 hex 颜色按亮度 factor 做混合（factor<1 变深、>1 变浅） */
function tintHex(hex, factor) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0,2),16);
    const g = parseInt(h.slice(2,4),16);
    const b = parseInt(h.slice(4,6),16);
    const mix = (c) => Math.max(0, Math.min(255, Math.round(255 - (255 - c) * factor)));
    const to2 = v => v.toString(16).padStart(2,'0');
    return '#' + to2(mix(r)) + to2(mix(g)) + to2(mix(b));
}

function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error-msg');
    el.style.display = 'block';
    el.textContent = '加载失败：' + msg + '（请确保 Flask 后端已启动）';
}

axios.get('http://127.0.0.1:5000/api/production_region')
    .then(res => {
        if (res.data.code !== 200) { showError(res.data.msg || '未知错误'); return; }
        document.getElementById('loading').style.display = 'none';
        render(res.data.data.country_compare);
    })
    .catch(err => showError(err.message));

function render(compare) {
    const continents = Object.keys(compare);
    const container  = document.getElementById('container');

    /* 顶部说明 */
    const note = document.createElement('div');
    note.className = 'top-note';
    note.innerHTML =
        '<b>面积图读法</b>：横轴仅两个点（2001 / 2024），每层带状区域宽度 = 该国当年产量；' +
        '整体堆叠总高 = 该洲总产量。层向上倾斜 = 增产，向下收窄 = 减产；层的头尾梯形面积直观反映跨年变化量。' +
        '<br>注意：面积/宽度感知精度低于共同基线的长度，本图侧重"结构与走向"，具体量以 tooltip 数字为准。';
    container.appendChild(note);

    continents.forEach(cont => {
        // 按 2024 产量降序，大在底部（更稳定的阅读顺序）
        const entries = [...compare[cont]].sort((a, b) => b.v2024 - a.v2024);
        const color   = CONT_COLOR[cont] || '#888';

        // 洲总产量（用于图高自适应 & 顶部总计标注）
        const total2001 = entries.reduce((s, e) => s + e.v2001, 0);
        const total2024 = entries.reduce((s, e) => s + e.v2024, 0);
        const totalMax  = Math.max(total2001, total2024);

        const n = entries.length;
        // 图高：国家越多、总量越大，图越高（但设上下限）
        const h = Math.max(280, Math.min(680, n * 42 + 160));

        const div = document.createElement('div');
        div.className = 'chart-block';
        div.style.height = h + 'px';
        container.appendChild(div);

        // 为每个国家分配一个基于洲主色的深浅色
        // 底层最深（factor 小），顶层最浅
        const seriesData = entries.map((e, idx) => {
            const factor = 0.45 + 0.55 * (idx / Math.max(1, n - 1));  // 0.45 → 1.0
            return {
                name: e.country,
                v2001: e.v2001,
                v2024: e.v2024,
                fill: tintHex(color, factor)
            };
        });

        const series = seriesData.map(d => {
            const diff = d.v2024 - d.v2001;
            return {
                name: d.name,
                type: 'line',
                stack: 'total',
                smooth: false,
                symbol: 'circle',
                symbolSize: 5,
                lineStyle: { width: 0.8, color: '#ffffff' },
                areaStyle: { color: d.fill, opacity: 0.95 },
                emphasis: { focus: 'series', areaStyle: { opacity: 1 } },
                data: [d.v2001, d.v2024],
                // 只在 2024 一侧显示国家名 + 变化幅度
                label: {
                    show: true,
                    position: 'insideRight',
                    formatter: () => {
                        const sign = diff >= 0 ? '+' : '';
                        const pct = Math.max(d.v2001, d.v2024) > 0
                            ? (diff / Math.max(d.v2001, d.v2024) * 100).toFixed(0) + '%'
                            : '';
                        return `${d.name}  ${sign}${diff.toFixed(0)}  (${pct})`;
                    },
                    color: '#1a1a2e',
                    fontSize: 10,
                    textBorderColor: '#fff',
                    textBorderWidth: 2
                },
                labelLayout: (params) => {
                    // 让每个 label 贴在 2024 那侧的中点
                    if (params.dataIndex !== 1) return { fontSize: 0 };
                    return {};
                }
            };
        });

        const chart = echarts.init(div);
        chart.setOption({
            backgroundColor: '#ffffff',
            title: {
                text: `${cont}  ·  2001 → 2024 产量结构变化`,
                subtext: `洲总量：${total2001.toLocaleString()} → ${total2024.toLocaleString()} 千桶/日 ` +
                         `（${total2024 >= total2001 ? '+' : ''}${(total2024-total2001).toLocaleString()}，` +
                         `${((total2024-total2001)/total2001*100).toFixed(1)}%）`,
                left: 16, top: 8,
                textStyle: { color: color, fontSize: 14, fontWeight: 'bold' },
                subtextStyle: { color: '#555', fontSize: 11 }
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'line', lineStyle: { color: '#999', type: 'dashed' } },
                formatter: params => {
                    if (!params || !params.length) return '';
                    const year = params[0].axisValue;
                    const yearKey = year === '2001' ? 'v2001' : 'v2024';
                    // 按堆叠顺序倒序（底层大在下、顶层小在上，展示时从上到下即倒序）
                    const rows = seriesData.map((d, i) => ({
                        name: d.name, val: d[yearKey], color: d.fill,
                        other: d[yearKey === 'v2001' ? 'v2024' : 'v2001']
                    })).filter(r => r.val > 0);
                    rows.sort((a, b) => b.val - a.val);
                    const total = rows.reduce((s, r) => s + r.val, 0);
                    let html = `<div style="font-weight:600;margin-bottom:4px">${year}　洲总计 ${total.toLocaleString()}</div>`;
                    rows.forEach(r => {
                        const diff = year === '2024' ? (r.val - r.other) : (r.other - r.val);
                        const sign = diff >= 0 ? '+' : '';
                        const pct = Math.max(r.val, r.other) > 0
                            ? (diff / Math.max(r.val, r.other) * 100).toFixed(1) + '%'
                            : '';
                        html += `<div style="font-size:12px;padding:2px 0">
                            <span style="display:inline-block;width:10px;height:10px;background:${r.color};margin-right:6px;border-radius:2px"></span>
                            ${r.name}：<b>${r.val.toLocaleString()}</b>
                            <span style="color:#888">（另一年 ${r.other.toLocaleString()}，${sign}${diff.toFixed(0)} / ${pct}）</span>
                        </div>`;
                    });
                    return html;
                }
            },
            grid: { left: 90, right: 220, top: 62, bottom: 40 },
            xAxis: {
                type: 'category',
                data: ['2001', '2024'],
                boundaryGap: false,
                axisLabel: { color: '#333', fontSize: 13, fontWeight: 600 },
                axisLine: { lineStyle: { color: '#bbb' } }
            },
            yAxis: {
                type: 'value',
                name: '千桶/日',
                nameTextStyle: { color: '#555', padding: [0, 0, 8, -30] },
                axisLabel: { color: '#555', formatter: v => (v/1000).toFixed(0) + 'k' },
                splitLine: { lineStyle: { color: '#eee' } },
                min: 0,
                max: Math.ceil(totalMax * 1.05 / 1000) * 1000
            },
            series
        });

        // 在 2001 侧顶部标一个总量文字，与 2024 侧对照
        chart.setOption({
            graphic: [
                {
                    type: 'text',
                    left: 90 + 4,
                    top: 62 - 16,
                    style: {
                        text: total2001.toLocaleString(),
                        fill: '#333', fontSize: 11, fontWeight: 600
                    }
                }
            ]
        });

        window.addEventListener('resize', () => chart.resize());
    });
}
</script>
</body>
</html>
