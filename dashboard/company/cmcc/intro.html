<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../common/base.css">
    <link rel="stylesheet" href="../page.css">
    <script src="../../common/site-header.js" defer></script>
    <style>
        .note-generic {
            margin: 10px 0 0; padding: 12px 16px; background: #f6f7f9;
            border-left: 4px solid #b7b1c4; border-radius: 6px;
            font-size: 18px; color: #555; line-height: 1.75;
        }
        .gap-list { margin: 6px 0 0 18px; font-size: 18px; color: #555; line-height: 1.8; }
        .gap-list b { color: #10243e; }
        /* 里程碑：年份靠左、正文靠右的两列流水 */
        .ms-list { margin-top: 10px; }
        .ms-row { display: flex; gap: 16px; padding: 9px 0; border-bottom: 1px dashed #e5e7eb; }
        .ms-row:last-child { border-bottom: none; }
        .ms-yr { flex: 0 0 96px; font-size: 18px; font-weight: 700; color: #10243e; }
        .ms-era { flex: 0 0 96px; font-size: 16px; color: #fff; border-radius: 4px;
                  text-align: center; height: 26px; line-height: 26px; }
        .ms-txt { font-size: 18px; color: #444; line-height: 1.7; }
        .ms-txt b { color: #10243e; }
    </style>
    <title>中国移动（941 / 600941）· 简介与股权</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="charts/boot.js" data-page="intro"></script>
</head>
<body>
<div class="wrap">

    <div class="page-head">
        <h1>中国移动有限公司 · 简介与股权</h1>
        <div class="meta">
            1997 年 9 月 3 日在中国香港注册 · 1997 年 10 月在纽交所、港交所上市 · 2021 年 5 月自纽交所退市 · 2022 年 1 月 5 日 A 股在上交所上市<br>
            数据取自公司年报与官网投资者关系页，比例与股本均注明截止日期
        </div>
        <div class="tags"><span>公司概况</span><span>股权结构</span><span>里程碑</span><span>风险</span></div>
    </div>

    <!-- ══════════ 公司概况 ══════════ -->
    <section id="sec-profile">
        <h2>公司概况</h2>
        <p class="sub" id="profile-sub"></p>
        <div class="kpis" id="profile-kpis"></div>
        <div class="cards" id="profile-cards" style="margin-top:14px"></div>
    </section>

    <!-- ══════════ 股权结构 ══════════ -->
    <section id="sec-holders">
        <h2>股权结构</h2>
        <p class="sub" id="holders-sub"></p>
        <div id="chart-holders" class="chart" style="height:420px"></div>
        <div class="note-generic" id="holders-note"></div>
    </section>

    <!-- ══════════ 里程碑 ══════════ -->
    <section id="sec-milestones">
        <h2>公司大事记（按产品世代着色）</h2>
        <p class="sub">同一条时间线上看两件事：<b>公司的资本动作</b>（上市、省公司注入、A 股回归）与<b>产品的换代</b>（2G/短信 → 3G → 4G 流量 → 5G → 算力与 AI）</p>
        <div class="ms-list" id="ms-list"></div>
    </section>

    <!-- ══════════ 口径与缺口 ══════════ -->
    <section id="sec-gaps">
        <h2>口径提示与披露缺口</h2>
        <ul class="gap-list" id="gaps-list"></ul>
    </section>

</div>
</body>
</html>
