<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../common/base.css">
    <link rel="stylesheet" href="../page.css">
    <title>运营商公司详情 · 收入构成</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { background: #f5f6f8; }
        .entity { margin: 10px 0 0; padding: 12px 16px; background: #fff7ed;
                  border-left: 4px solid #f59e0b; border-radius: 6px;
                  font-size: 17px; color: #78350f; line-height: 1.7; }
        th:first-child, td:first-child { text-align: left; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="page-head">
        <h1 id="page-title">收入构成</h1>
        <div class="meta" id="page-meta"></div>
        <div class="tags"><span>年报附注原文</span><span>分业务收入</span><span>结构占比</span><span>同比增速</span></div>
    </div>

    <div id="loading">加载中…（需先启动 backend_python.py，端口 5000）</div>
    <div id="error-msg"></div>

    <section id="sec-kpi" hidden>
        <h2 id="kpi-title">最新年度收入构成</h2>
        <p class="sub" id="kpi-sub"></p>
        <div class="kpis" id="kpis"></div>
        <div class="entity" id="caliber-warn"></div>
    </section>

    <div id="charts"></div>

    <section id="sec-table" hidden>
        <h2>分业务收入明细</h2>
        <p class="sub">单位：亿元（括号内为占营业收入比重）· 逐年取自年报「营业收入和营业成本」附注的本年列</p>
        <div style="overflow-x:auto">
            <table>
                <thead><tr id="tbl-head"></tr></thead>
                <tbody id="tbl-body"></tbody>
            </table>
        </div>
        <div class="note" id="tbl-note" style="max-width:none"></div>
    </section>
</div>
<script src="charts/common.js"></script>
<script src="charts/segment.js"></script>
</body>
</html>
