<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../common/base.css">
    <link rel="stylesheet" href="../page.css">
    <title>运营商公司详情 · 业绩与财务</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { background: #f5f6f8; }
        .wrap { max-width: 1500px; }
        .entity { margin: 10px 0 0; padding: 12px 16px; background: #fff7ed;
                  border-left: 4px solid #f59e0b; border-radius: 6px;
                  font-size: 17px; color: #78350f; line-height: 1.7; }
        details.note-more > summary { list-style: revert; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="page-head">
        <h1 id="page-title">业绩与财务</h1>
        <div class="meta" id="page-meta"></div>
        <div class="tags"><span>营收与利润</span><span>ROE 与毛利率</span><span>净现金</span><span>资本开支</span><span>人效</span><span>派息</span></div>
    </div>

    <div id="loading">加载中…（需先启动 backend_python.py，端口 5000）</div>
    <div id="error-msg"></div>

    <section id="sec-kpi" hidden>
        <h2 id="kpi-title">最新年度关键指标</h2>
        <p class="sub" id="kpi-sub"></p>
        <div class="kpis" id="kpis"></div>
        <div class="entity" id="entity-note"></div>
    </section>

    <div id="charts"></div>

    <section id="sec-caliber" hidden>
        <h2>数据来源与口径</h2>
        <p class="sub">财务层来自东方财富公司数据接口的 A 股年报合并数；经营层与收入构成层来自上交所年报原文</p>
        <div id="caliber"></div>
    </section>
</div>
<script src="charts/common.js"></script>
<script src="charts/perf.js"></script>
</body>
</html>
