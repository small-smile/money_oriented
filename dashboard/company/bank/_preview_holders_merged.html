<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>效果预览 · 内圈明细 + 外圈一致行动人 + 两列标注</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
    body { margin: 0; padding: 24px; background: #f4f5f7; font: 18px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #333; }
    .wrap { max-width: 1280px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 22px 26px 30px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h1 { font-size: 24px; margin: 0 0 6px; color: #4a2a5a; }
    .meta { font-size: 17px; color: #666; margin-bottom: 6px; }
    .chart-title { font-size: 19px; font-weight: 600; color: #333; margin: 14px 0 6px; }
    /* 筛选行只是切换用的开关，字号比正文小一档，免得抢掉图的注意力、也少占纵向空间 */
    .chart-btns { display: flex; align-items: center; gap: 6px; justify-content: center; margin: 10px 0 2px; flex-wrap: wrap; }
    /* 公司筛选和圈序同一行：公司按钮相对整行居中，圈序按钮绝对定位钉在右端，
     * 这样圈序不占一整行、也不把公司那组按钮挤离中线。 */
    .btn-row { position: relative; }
    .btn-row #btns2 { position: absolute; right: 0; top: 50%; transform: translateY(-50%); margin: 0; }
    .chart-btns .label { font-size: 14px; color: #777; }
    .chart-btns button { font: inherit; font-size: 14px; line-height: 1.5; padding: 3px 10px; border: 1px solid #cfc6d8;
        background: #fff; color: #4a2a5a; border-radius: 12px; cursor: pointer; }
    .chart-btns button.active { background: #6c3483; border-color: #6c3483; color: #fff; }
    /* 股东明细表格弹层：表比一屏长时在框内滚，滚动区是内层 #det-body ——
     * 让 .modal-box 自己滚会把竖滚动条压在右侧圆角上、看着右边被切平；交给内层后
     * 滚动条落在 22px 的内边距里，四角完好。表头 sticky 钉在滚动区顶部。 */
    .modal { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,.35);
        display: none; z-index: 99; overflow: auto; }
    .modal.on { display: block; }
    .modal-box { position: relative; margin: 2vh auto; width: 1320px; max-width: 96vw;
        box-sizing: border-box; max-height: 92vh; display: flex; flex-direction: column;
        overflow: hidden;
        background: #fff; border-radius: 10px; padding: 14px 22px 22px;
        box-shadow: 0 6px 24px rgba(0,0,0,.25); }
    #det-body { overflow: auto; flex: 1; min-height: 0; }
    /* 只剩一个关闭按钮，靠右；标题与口径说明那一行已去掉（图上方已有同样的信息） */
    .modal-hd { display: flex; justify-content: flex-end; margin-bottom: 4px; }
    .modal-hd button { font: inherit; font-size: 18px; line-height: 1; color: #888; background: none;
        border: 0; cursor: pointer; padding: 4px 6px; }
    /* 明细表照 shareholder.html 那张表来：那边用的是 dashboard/company/page.css 的正文
     * 表格样式（18px、行线浅灰、表头浅蓝底 + 金色下框线、行悬浮浅蓝、合计行金线加粗、
     * 数字右对齐首列左对齐）。本预览页是独立文件、没引 page.css，所以把那几条抄过来。 */
    .modal table { width: 100%; border-collapse: collapse; font-size: 18px; }
    .modal th, .modal td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #eee; }
    .modal th:first-child, .modal td:first-child { text-align: left; }
    .modal thead th { background: #eef2f7; color: #10243e; font-weight: 600;
        border-bottom: 2px solid #c9a24a; position: sticky; top: 0; z-index: 1; }
    .modal tbody tr:hover { background: #f3f6fa; }
    .modal th.tl, .modal td.tl { text-align: left; }
    /* 只有数字列不许折行（金额折成两半就读不成数了）；文字列该折就折 */
    .modal th.num, .modal td.num { white-space: nowrap; }
    /* 类别在末列，按本页规矩（只有数字列强制不折）允许折行——宁可它折成两行，
     * 也不要把宽度从股东名称那列抽走、让长名折成三行 */
    .modal th.nat, .modal td.nat { text-align: left; }
    /* 一致行动人列同理：值都很短（汇金系 / 社保基金 / ETF），却被挤成「社保基 金」，一律不折 */
    .modal th.fac, .modal td.fac { text-align: left; white-space: nowrap; }
    .modal td.nat { color: #777; }
    .modal td.idx { color: #aaa; width: 34px; }
    .modal .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px;
        vertical-align: -2px; margin-right: 6px; }
    .modal .tag { color: #999; font-size: 14px; margin-left: 6px; }
    .modal tfoot td { font-weight: 700; background: #f6f8fb; border-top: 2px solid #c9a24a;
        border-bottom: 0; }
    /* 点击标注行弹出的全称框：贴在那一行下面（下面放不下就翻到上面），横向不超出画布，
     * 太长就折行。做成带边框和投影的独立弹框，跟画布上的文字明显分层，不假装是同一行。 */
    #row-full { position: absolute; display: none; z-index: 6; max-width: 560px;
        background: #fff; border: 1px solid #d8cfe0; border-radius: 10px; padding: 12px 16px;
        box-shadow: 0 6px 20px rgba(0,0,0,.2); font-size: 20px; line-height: 1.6;
        word-break: break-all; pointer-events: none; }
</style>

/* ==== 样式常量：与 charts.js 保持一致 ==== */
/* 斜线纹理工厂：底色 + 斜线色，10×10 平铺；同一组合只画一次
 * 原型是 charts.js 的 RESIDUAL_PATTERN（石油瀑布图那版灰斜线）。 */
var HATCH_CACHE = {};
function hatch(base, line) {
    var key = base + '|' + line;
    if (HATCH_CACHE[key]) return HATCH_CACHE[key];
    var c = document.createElement('canvas');
    c.width = 10; c.height = 10;
    var x = c.getContext('2d');
    x.fillStyle = base; x.fillRect(0, 0, 10, 10);
    x.strokeStyle = line; x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(0, 10); x.lineTo(10, 0); x.stroke();
    x.beginPath(); x.moveTo(-2, 2); x.lineTo(2, -2); x.stroke();
    x.beginPath(); x.moveTo(8, 12); x.lineTo(12, 8); x.stroke();
    return (HATCH_CACHE[key] = { image: c, repeat: 'repeat' });
}
function hatchCss(base, line) {
    return 'repeating-linear-gradient(45deg,' + line + ' 0 1.5px,' + base + ' 1.5px 7.1px)';
}

var RESIDUAL_SWATCH_CSS = hatchCss('#f0f0f0', '#999');

 * 避免两者撞色。 */
var NOMINEE_COLOR = '#3d7ebf';
var NOMINEE_PATTERN = hatch(NOMINEE_COLOR, '#fff');
var NOMINEE_SWATCH_CSS = hatchCss(NOMINEE_COLOR, '#fff');

var PIE_COLORS = ['#6c3483', '#e67e22', '#16a085', '#c0392b', '#f1c40f',

/* 色相（0-360），自动配色靠它挑一个离已用色最远的颜色 */
function hueOf(hex) {
    var n = parseInt(String(hex).replace('#', ''), 16);
    var r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
    if (d) {
        if (mx === r) h = 60 * (((g - b) / d) % 6);
        else if (mx === g) h = 60 * ((b - r) / d + 2);
        else h = 60 * ((r - g) / d + 4);
    }
    return (h + 360) % 360;
}
/* 数据里派系自带的颜色若撞上名义持有人专用色，弃用、回落到调色板 */
function keepColor(color) {
    if (!color) return '';
    return RESERVED_NOMINEE.indexOf(String(color).toLowerCase()) >= 0 ? '' : color;
}
/* 派系色块/扇区填充：残余灰斜线、名义持有人蓝斜线、其余纯色 */
function facFill(g) {
    return g.residual ? RESIDUAL_PATTERN : (g.nominee ? NOMINEE_PATTERN : g.color);
}
/* 同色系变浅：t=0 原色，t 越大越接近白 */
function shade(hex, t) {
    var n = parseInt(String(hex).replace('#', ''), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;

        /* 推出量：外圈往外是空地，可以推狠一点；内圈往外只有两圈之间那道缝，
         * 推过头就顶到外圈上去，所以按缝宽给（缝 = outBand[0] - inBand[1]） */
        series: [pie(facR, d.fac, scaleOut(facR)), pie(detR, d.detail, scaleOut(detR))],
        graphic: (layout === 'cols' ? buildCols : buildTree)(geo, d.cmap, m)
    }, true);
    LAST = { geo: geo, cmap: d.cmap, m: m };
    /* 两列排布已经把清单搬到右侧，图下方的清单就不再重复 */
    document.getElementById('legend').style.display = layout === 'cols' ? 'none' : '';
}
/* 图下清单：派系一行，括号里列成员全称 */
function renderLegend() {
    document.getElementById('legend').innerHTML = FAC_ROWS.map(function (g) {
        var swatch = g.residual ? RESIDUAL_SWATCH_CSS
                   : (g.nominee ? NOMINEE_SWATCH_CSS : g.color);
        var items = g.members.map(function (x) { return x.name + ' ' + x.pct.toFixed(2) + '%'; })
                             .join('　');
        return '<div style="margin:3px 0"><span style="display:inline-block;width:12px;height:12px;'
            + 'border-radius:3px;background:' + swatch + ';vertical-align:-1px;margin-right:6px"></span>'
            + '<b style="color:#4a2a5a">' + g.title + '</b> '
            + '<span style="color:#6c3483;font-weight:600">' + g.value.toFixed(2) + '%</span>'
            + (g.members.length > 1 ? '　<span style="color:#777">（' + items + '）</span>' : '')
            + '</div>';
    }).join('');
}
/* ==== 股东明细表格：图上按派系分组、名字截断，这里给一份全量长名清单 ==== */
var MODAL = document.getElementById('det-modal');
/* 股东性质、持股数按数据块里有没有决定要不要出这一列 —— 换行业/换公司都不用改代码 */
/* 报告期内增减：红涨绿跌、0 写「不变」、没披露写「—」，配色跟 charts/holders.js
 * 那张表一致（+ 用 #c0392b、− 用 #1e8449、不变 #888）。 */
function chgCell(v) {
    if (v == null) return '<td class="num" style="color:#bbb">—</td>';
    if (!v) return '<td class="num" style="color:#888">不变</td>';
    return '<td class="num" style="color:' + (v > 0 ? '#c0392b' : '#1e8449') + '">'
        + (v > 0 ? '+' : '-') + fmtNum(Math.abs(v)) + '</td>';
}
function detailTableHTML() {
    var hasType = false, hasNum = false, hasChg = false;
    FAC_ROWS.forEach(function (g) {
        g.members.forEach(function (h) {
            if (h.type) hasType = true;
            if (h.shares) hasNum = true;
            if (h.chg != null) hasChg = true;
        });
    });
    var rows = [], n = 0, tot = 0, totNum = 0, lack = 0, totChg = 0;
    FAC_ROWS.forEach(function (g) {
        var txt = facTextColor(g);
        g.members.forEach(function (h) {
            n++; tot += h.pct;
            if (h.shares) totNum += h.shares; else lack++;
            if (h.chg) totChg += h.chg;
            /* 色块并进名称格（shareholder.html 那张表没有单独的色块列）；
             * 名称与一致行动人两列都用派系色，同一派系的行文字同色。 */
            rows.push('<tr><td class="idx">' + n + '</td>'
                + '<td class="tl" style="color:' + txt + '"><span class="sw" style="background:'
                    + (h._swatch || '#ccc') + '"></span>' + h.name + '</td>'
                + '<td class="tl fac" style="color:' + txt + '">' + g.title + '</td>'
                + (hasNum ? '<td class="num">' + (h.shares ? fmtNum(h.shares) : '—') + '</td>' : '')
                + (hasChg ? chgCell(h.chg) : '')
                + '<td class="num">' + h.pct.toFixed(2) + '%</td>'
                // 类别放最后一列：它是定性标签，摆在数字列中间会把「持股数—增减—占比」这串数字截断
                + (hasType ? '<td class="nat">' + (h.type || '—') + '</td>' : '')
                + '</tr>');
        });
    });
    /* 表头用词跟 shareholder.html 对齐（股东名称 / 类别）；比例列写「占 A 股」——
     * 本页数据已剔除 H 股、按 A 股基数重算，写「占总股本」是口径错的。 */
    return '<table><thead><tr><th></th><th class="tl">股东名称</th><th class="tl fac">所属一致行动人</th>'
        + (hasNum ? '<th class="num">持股数（股）</th>' : '')
        + (hasChg ? '<th class="num">报告期内增减（股）</th>' : '')
        + '<th class="num">占 A 股</th>'
        + (hasType ? '<th class="nat">类别</th>' : '')
        + '</tr></thead><tbody>' + rows.join('')
        + '</tbody><tfoot><tr><td colspan="3">合计</td>'
        + (hasNum ? '<td class="num">' + fmtNum(totNum)
                    + (lack ? '<span class="tag">未披露 ' + lack + ' 项</span>' : '') + '</td>' : '')
        + (hasChg ? chgCell(totChg) : '')
        + '<td class="num">' + tot.toFixed(2) + '%</td>'
        + (hasType ? '<td class="nat"></td>' : '')
        + '</tr></tfoot></table>';
}
function openDetail() {
    document.getElementById('det-body').innerHTML = detailTableHTML();
    MODAL.classList.add('on');
}
function closeDetail() { MODAL.classList.remove('on'); }
document.getElementById('det-close').addEventListener('click', closeDetail);
MODAL.addEventListener('click', function (e) { if (e.target === MODAL) closeDetail(); });
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeDetail(); hideFull(); }
});

function onBtnClick(e) {
    var b = e.target.closest('button');
    if (!b) return;
    ['order', 'mode', 'layout', 'ds'].forEach(function (k) {
        if (!b.hasAttribute('data-' + k)) return;
        var v = b.getAttribute('data-' + k);
        if (k === 'order') order = v;
        else if (k === 'mode') mode = v;
        else if (k === 'layout') layout = v;
        else ds = v;
        document.querySelectorAll('[data-' + k + ']').forEach(function (x) {
            x.classList.toggle('active', x.getAttribute('data-' + k) === v);
        });
    });
    render();
    renderLegend();
}
/* 环上悬浮：不弹浮层，只把对应的股东明细行 / 一致行动人行点亮；
 * 移出图外时 zrender 只给 globalout，series 的 mouseout 不一定到，两个都接。 */
chart.on('mouseover', function (q) {
    if (q.componentType !== 'series') return;
    setHot(q.seriesIndex, q.dataIndex);
});
chart.on('mouseout', function (q) {
    if (q.componentType === 'series') clearHot();
});
chart.getZr().on('globalout', clearHot);
/* 收起钉住的全称：点图上空白处、点图外任何地方、按 Esc；切公司/排布时 render 里也会收。 */
chart.getZr().on('click', function (e) { if (!e.target) hideFull(); });
document.addEventListener('click', function (e) {
    if (!chart.getDom().contains(e.target)) hideFull();
});
document.getElementById('btns').addEventListener('click', onBtnClick);
/* 圈序只留一个按钮：写着当前内圈是谁，点一下两圈互换 */
var ORDER_BTN = document.getElementById('btn-order');
function paintOrderBtn() {
    ORDER_BTN.textContent = order === 'detail-in' ? '内圈：股东明细' : '内圈：一致行动人';
}
ORDER_BTN.addEventListener('click', function () {
    order = order === 'detail-in' ? 'fac-in' : 'detail-in';
    paintOrderBtn();
    render();
    renderLegend();
});
paintOrderBtn();
window.addEventListener('resize', function () { chart.resize(); render(); });
render();
renderLegend();
</script>
</body>
</html>
