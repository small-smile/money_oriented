    <div class="note">

    {"title": "内资法人", "color": "#e67e22", "names": ["中国工商银行股份有限公司-华泰柏瑞沪深300交易型开放式指数证券投资基金", "中国建设银行股份有限公司-易方达沪深300交易型开放式指数发起式证券投资基金", "中国工商银行股份有限公司-华夏沪深300交易型开放式指数证券投资基金", "深圳市恩情投资发展有限公司", "中国银行股份有限公司-嘉实沪深300交易型开放式指数证券投资基金"]},
    {"title": "其他流通股东", "color": "#95a5a6", "names": ["其他流通股东"]},
  ]
},
};
var ds = '601398';
/* ==== 样式常量：与 charts.js 保持一致 ==== */
/* 残余项灰斜线纹理，照搬 charts.js 的 RESIDUAL_PATTERN（石油瀑布图原版） */
var RESIDUAL_PATTERN = (function () {
    var c = document.createElement('canvas');
    c.width = 10; c.height = 10;
    var x = c.getContext('2d');
    x.fillStyle = '#f0f0f0'; x.fillRect(0, 0, 10, 10);
    x.strokeStyle = '#999'; x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(0, 10); x.lineTo(10, 0); x.stroke();
    x.beginPath(); x.moveTo(-2, 2); x.lineTo(2, -2); x.stroke();
    x.beginPath(); x.moveTo(8, 12); x.lineTo(12, 8); x.stroke();
    return { image: c, repeat: 'repeat' };
})();
var RESIDUAL_SWATCH_CSS = 'repeating-linear-gradient(45deg,#999 0 1.5px,#f0f0f0 1.5px 7.1px)';
/* 名义持有人（香港中央结算 / 代理人）：蓝底 + 白斜线，与残余项的灰斜线同构 */
var NOMINEE_BLUE = '#3d7ebf';
var NOMINEE_PATTERN = (function () {
    var c = document.createElement('canvas');
    c.width = 10; c.height = 10;
    var x = c.getContext('2d');
    x.fillStyle = NOMINEE_BLUE; x.fillRect(0, 0, 10, 10);
    x.strokeStyle = '#fff'; x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(0, 10); x.lineTo(10, 0); x.stroke();
    x.beginPath(); x.moveTo(-2, 2); x.lineTo(2, -2); x.stroke();
    x.beginPath(); x.moveTo(8, 12); x.lineTo(12, 8); x.stroke();
    return { image: c, repeat: 'repeat' };
})();
var NOMINEE_SWATCH_CSS = 'repeating-linear-gradient(45deg,#fff 0 1.5px,' + NOMINEE_BLUE + ' 1.5px 7.1px)';
var PIE_COLORS = ['#6c3483', '#e67e22', '#2980b9', '#16a085', '#c0392b', '#f1c40f',
                  '#8e44ad', '#27ae60', '#d35400', '#2c3e50', '#c2185b', '#00838f'];
/* 派系色块/扇区填充：残余灰斜线、名义持有人蓝斜线、其余纯色 */
function facFill(g) {
    return g.residual ? RESIDUAL_PATTERN : (g.nominee ? NOMINEE_PATTERN : g.color);
}
/* 同色系变浅：t=0 原色，t 越大越接近白 */
function shade(hex, t) {
    var n = parseInt(String(hex).replace('#', ''), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(r + (255 - r) * t);
    g = Math.round(g + (255 - g) * t);
    b = Math.round(b + (255 - b) * t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
}
/* ==== 统一模板：以下全部与「哪家公司 / 哪个行业」无关，只吃标准数据块 ====
 * 输入 = dashboard 注入的 D['holders'] / D['holders-through']（各行业同一结构）：
 *   { holders: [{name, pct, type}], factions: [{title, color, names}] }
 * 容错：派系可以缺、可以只覆盖部分股东、点名的股东可以没披露、披露合计可以不到 100%。
 * 版面（行高、字号、列宽、左右留白、圆环半径、画布高度）全部由数据量 + 文字实测宽度算出，
 * 没有任何按公司手调的常量。 */
var mode = 'shade';          /* 明细配色：shade = 派系同色系深浅，each = 每家一色 */
var order = 'detail-in';     /* detail-in = 明细在内 / 派系在外；fac-in = 反过来 */
var layout = 'cols';         /* cols = 派系一列 + 明细一列（默认）；tree = 树状标注 */
var RESIDUAL_RE = /其他|其它|未披露|未达披露|other/i;
/* 名义持有人：只是代人登记的通道，不算真派系，单独配色并垫在残余项之前 */
var NOMINEE_RE = /香港中央结算|香港中央結算|香港.{0,6}代理人|HKSCC|nominee/i;
var DROP_TAIL_RE = /(股份有限公司|有限责任公司|有限合伙|有限公司|公司)$/;

/* 自动简称：多段名（「托管人-产品」「集团-本级-自有资金」）取信息量最大的一段，
 * 再砍掉通用后缀、压缩基金全称。不够短的话由 fit() 按实测宽度再截。 */
function autoShort(name) {
    var s = String(name || '').replace(/（/g, '(').replace(/）/g, ')').trim();
    var segs = s.split(/[-—]/).map(function (x) { return x.trim(); }).filter(Boolean);
    if (segs.length > 1) {
        s = segs.reduce(function (a, b) { return b.length > a.length ? b : a; }, segs[0]);
    }
    s = s.replace(/交易型开放式指数(发起式)?证券投资基金/g, 'ETF')
         .replace(/证券投资基金/g, '基金')
         .replace(DROP_TAIL_RE, '');
    return s || String(name || '');
}

/* 简称撞车时补一个区分段：「中国平安人寿保险-自有资金」和「…-传统-普通保险产品」
 * autoShort 都取到公司名那一段，会出现两行同名，这里把各自剩下的尾段接回来。 */
function segsOf(name) {
    return String(name || '').replace(/（/g, '(').replace(/）/g, ')')
        .split(/[-—]/).map(function (x) { return x.trim(); }).filter(Boolean);
}
function dedupeShorts(members) {
    var cnt = {};
    members.forEach(function (m) { cnt[m.short] = (cnt[m.short] || 0) + 1; });
    members.forEach(function (m, i) {
        if (cnt[m.short] < 2) return;
        var segs = segsOf(m.name), main = segs.reduce(function (a, b) {
            return b.length > a.length ? b : a;
        }, segs[0] || '');
        var rest = segs.filter(function (x) { return x !== main; });
        m.short = m.short + '·' + (rest.length ? autoShort(rest[rest.length - 1]) : String(i + 1));
    });
    return members;
}

/* 数据块 → 派系行：派系合计降序、残余垫最后、派系内明细降序
 * 取数用 holderData（图上的股东名 + value），factions[].names 引用的就是这套名字；
 * holders 那份是明细表用的长名，只在没有 holderData 时兜底，两者不能混用。 */
function normalize(block) {
    var raw = (block.holderData && block.holderData.length) ? block.holderData : (block.holders || []);
    var holders = raw.map(function (h) {
        return { name: h.name, pct: +(h.value != null ? h.value : h.pct) || 0,
                 type: h.type || '', short: autoShort(h.name) };
    });
    var byName = {}, used = {}, groups = [], ci = 0;
    holders.forEach(function (h) { byName[h.name] = h; });
    function push(title, color, members) {
        var val = +members.reduce(function (a, m) { return a + m.pct; }, 0).toFixed(2);
        var res = RESIDUAL_RE.test(title) ||
                  (members.length === 1 && RESIDUAL_RE.test(members[0].name));
        /* 组名点明是代理人，或组里每一家都是代理人 → 名义持有人组（混编的派系不算） */
        var nom = !res && (NOMINEE_RE.test(title) || (members.length > 0 &&
                  members.every(function (x) { return NOMINEE_RE.test(x.name); })));
        groups.push({
            title: title, short: autoShort(title), members: members, value: val,
            residual: res, nominee: nom,
            color: res ? '#95a5a6' : (nom ? NOMINEE_BLUE : (color || PIE_COLORS[ci++ % PIE_COLORS.length]))
        });
    }
    (block.factions || []).forEach(function (f) {
        var ms = (f.names || []).map(function (n) { return byName[n]; }).filter(Boolean);
        if (!ms.length) return;                    /* 派系点名的股东没披露 → 整组丢掉 */
        ms.forEach(function (m) { used[m.name] = 1; });
        ms.sort(function (a, b) { return b.pct - a.pct; });
        push(f.title, f.color, dedupeShorts(ms));
    });
    holders.forEach(function (h) {                 /* 没被任何派系认领的股东各自成组 */
        if (!used[h.name]) push(h.name, '', [h]);
    });
    var named = groups.filter(function (g) { return !g.residual; });
    var res = groups.filter(function (g) { return g.residual; });
    var sum = groups.reduce(function (a, g) { return a + g.value; }, 0);
    var gap = +(100 - sum).toFixed(2);
    var resMembers = [], resVal = 0, resTitle = res.length ? res[0].title : '其他股东';
    res.forEach(function (g) { resMembers = resMembers.concat(g.members); resVal += g.value; });
    if (gap > 0.01) {                              /* 披露合计不足 100% → 自动补差额 */
        resMembers.push({ name: '其他股东（未达披露线）', short: '其他股东', pct: gap,
                          type: '披露合计 ' + sum.toFixed(2) + '% 以外的部分' });
        resVal += gap;
    }
    named.sort(function (a, b) { return b.value - a.value; });
    var nomRows = named.filter(function (g) { return g.nominee; });
    if (nomRows.length) {                          /* 名义持有人排在所有实名派系之后 */
        named = named.filter(function (g) { return !g.nominee; }).concat(nomRows);
    }
    if (resVal > 0.01) {
        named.push({ title: resTitle, short: autoShort(resTitle), members: resMembers,
                     value: +resVal.toFixed(2), residual: true, color: '#95a5a6' });
    }
    return named;
}
var FAC_ROWS = [];
function buildFacRows() {
    FAC_ROWS = normalize(DATASETS[ds]);
    document.getElementById('meta').textContent = DATASETS[ds].meta;
}
/* 明细扇区颜色：残余纹理；shade 模式下同派系由深到浅，each 模式下每家一色 */
function detailColors() {
    var i = 0, map = {};
    FAC_ROWS.forEach(function (g) {
        var step = g.members.length > 4 ? 0.15 : 0.22;
        g.members.forEach(function (h, k) {
            if (g.residual) map[h.name] = RESIDUAL_PATTERN;
            else if (g.nominee) map[h.name] = NOMINEE_PATTERN;
            else if (mode === 'each') map[h.name] = PIE_COLORS[i % PIE_COLORS.length];
            else map[h.name] = shade(g.color, Math.min(0.72, k * step));
            i++;
        });
    });
    return map;
}
/* 两圈数据：顺序一致，所以明细扇区在角度上正好落在所属派系扇区里 */
function buildSeriesData() {
    var cmap = detailColors();
    var detail = [], fac = [];
    FAC_ROWS.forEach(function (g) {
        fac.push({
            name: g.title, value: g.value,
            itemStyle: { color: facFill(g) },
            _short: g.short, _members: g.members, _residual: g.residual, _nominee: g.nominee
        });
        g.members.forEach(function (h) {
            detail.push({
                name: h.name, value: h.pct,
                itemStyle: { color: cmap[h.name] },
                _short: h.short, _fac: g.title, _tag: h.type,
                _swatch: g.residual ? RESIDUAL_SWATCH_CSS
                       : (g.nominee ? NOMINEE_SWATCH_CSS : cmap[h.name])
            });
        });
    });
    return { detail: detail, fac: fac, cmap: cmap };
}

/* ==== 文字实测 + 版面度量 ==== */
var chart = echarts.init(document.getElementById('chart-merged'));
var LINE = '#bbb';
var FONT = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
var MEAS = document.createElement('canvas').getContext('2d');
function measure(s, fs, bold) {
    MEAS.font = (bold ? 'bold ' : '') + fs + 'px ' + FONT;
    return MEAS.measureText(String(s)).width;
}
function fit(s, fs, bold, maxW) {
    s = String(s);
    if (measure(s, fs, bold) <= maxW) return s;
    while (s.length > 1 && measure(s + '…', fs, bold) > maxW) s = s.slice(0, -1);
    return s + '…';
}
function rowCount() {
    var n = 0;
    FAC_ROWS.filter(function (f) { return !f.residual; }).forEach(function (f) {
        n += layout === 'cols' ? f.members.length
                               : 1 + (f.members.length > 1 ? f.members.length : 0);
    });
    return Math.max(1, n);
}
/* 行高/字号随行数缩放，列宽取该列最长文字的实测宽度（超预算就截断），
 * 左侧留白由残余项标注宽度决定 —— 换一家公司、换一个行业都不用改数。 */
function metrics(w, h) {
    var named = FAC_ROWS.filter(function (f) { return !f.residual; });
    var res = FAC_ROWS.filter(function (f) { return f.residual; })[0];
    var n = rowCount();
    var rowH = Math.max(24, Math.min(38, Math.floor((h - 96) / n)));
    var fsDet = Math.max(13, Math.min(20, rowH - 15));
    var fsFac = fsDet + 2;
    var facBudget = w * 0.13, detBudget = w * 0.19;
    var facW = 0, detW = 0, m = { fac: {}, det: {} };
    named.forEach(function (f) {
        m.fac[f.title] = fit(f.short, fsFac, true, facBudget);
        facW = Math.max(facW, measure(m.fac[f.title], fsFac, true));
        f.members.forEach(function (x) {
            m.det[x.name] = fit(x.short, fsDet, false, detBudget);
            detW = Math.max(detW, measure(m.det[x.name], fsDet, false));
        });
    });
    var vw = measure('88.88%', fsFac, true), vwd = measure('88.88%', fsDet, false);
    var right = layout === 'cols'
        ? 34 + 14 + facW + 16 + vw + 26 + 24 + 22 + detW + 18 + vwd + 14
        : 34 + 14 + Math.max(facW, 46 + detW) + 20 + Math.max(vw, vwd) + 14;
    var left = 28;
    if (res) {
        m.res = fit(res.short, fsDet, false, w * 0.13);
        left = 26 + Math.max(measure(m.res, fsDet, false),
                             measure(res.value.toFixed(2) + '%', fsDet, false)) + 26;
    }
    m.rowH = rowH; m.fsDet = fsDet; m.fsFac = fsFac; m.facW = facW; m.detW = detW;
    m.vw = vw; m.vwd = vwd; m.left = left; m.right = right; m.named = named; m.res = m.res;
    return m;
}
function pt(cx, cy, r, deg) {
    var a = deg * Math.PI / 180;
    return [cx + r * Math.cos(a), cy - r * Math.sin(a)];
}
/* 引线点：扇区落在右半边时拐一次直接接标注；落在左半边时（大扇区常见）先贴着外环
 * 画一段圆弧绕到右侧，否则直线会横穿整个环。弧的出口角取与标注行等高的那个角度。 */
function leaderPoints(geo, deg, rowY, elbowX, endX) {
    var cx = geo.cx, cy = geo.cy, r0 = geo.rEdge + 6, r1 = geo.rEdge + 14;
    var start = pt(cx, cy, r0, deg);
    if (Math.cos(deg * Math.PI / 180) > 0.08) return [start, [elbowX, rowY], [endX, rowY]];
    var s = Math.max(-1, Math.min(1, (cy - rowY) / r1));
    var exit = Math.asin(s) * 180 / Math.PI;          /* -90..90，必在右半边 */
    var a0 = deg, norm = ((deg % 360) + 360) % 360, dlt = exit - norm;
    while (dlt > 180) dlt -= 360;
    while (dlt < -180) dlt += 360;
    var pts = [start];
    for (var i = 0; i <= 18; i++) pts.push(pt(cx, cy, r1, a0 + dlt * i / 18));
    pts.push([endX, rowY]);
    return pts;
}
/* 画笔：graphic 元素都是 silent，交互仍走饼图自己的 tooltip */
function pen(g, m) {
    return {
        text: function (x, y, str, opt) {
            g.push({ type: 'text', x: x, y: y, silent: true, style: Object.assign({
                text: str, fill: '#333', fontSize: m.fsDet, fontFamily: FONT,
                align: 'left', verticalAlign: 'middle'
            }, opt || {}) });
        },
        poly: function (points) {
            g.push({ type: 'polyline', silent: true, shape: { points: points },
                     style: { stroke: LINE, fill: 'none', lineWidth: 1 } });
        },
        line: function (x1, y1, x2, y2) {
            g.push({ type: 'line', silent: true, shape: { x1: x1, y1: y1, x2: x2, y2: y2 },
                     style: { stroke: LINE, lineWidth: 1 } });
        },
        rect: function (x, y, w, h, fill) {
            g.push({ type: 'rect', silent: true, shape: { x: x, y: y, width: w, height: h, r: 3 },
                     style: { fill: fill } });
        }
    };
}
/* 残余项不进右侧列表：单独挂左侧，色块用灰斜线纹理，名称与比例分两行 */
function drawResidual(g, geo, m) {
    var res = FAC_ROWS.filter(function (f) { return f.residual; })[0];
    if (!res) return;
    var p = pen(g, m), rp = pt(geo.cx, geo.cy, geo.rEdge + 6, res.mid), ry = rp[1] + 16;
    p.poly([rp, [rp[0] - 20, ry], [m.left - 14, ry]]);
    p.rect(6, ry - 22, 18, 18, RESIDUAL_PATTERN);
    p.text(30, ry - m.fsDet * 0.6, m.res, { fill: '#555' });
    p.text(30, ry + m.fsDet * 0.75, res.value.toFixed(2) + '%', { fill: '#555' });
}
/* 树状标注：引线 → 派系节点 → 分叉出成员公司 */
function buildTree(geo, cmap, m) {
    var g = [], p = pen(g, m), rowH = m.rowH;
    var x0 = geo.w - m.right + 34, nameX = x0 + 14, trunkX = x0 + 18, valRight = geo.w - 14;
    var y = geo.cy - (rowCount() - 1) * rowH / 2;
    m.named.forEach(function (f) {
        var facY = y;
        p.poly(leaderPoints(geo, f.mid, facY, x0 - 30, x0 - 8));
        p.rect(x0, facY - 10, 6, 20, facFill(f));
        p.text(nameX, facY, m.fac[f.title],
               { fontSize: m.fsFac, fontWeight: 'bold', fill: '#4a2a5a' });
        p.text(valRight, facY, f.value.toFixed(2) + '%',
               { fontSize: m.fsFac, fontWeight: 'bold', fill: '#6c3483', align: 'right' });
        y += rowH;
        if (f.members.length > 1) {
            p.line(trunkX, facY + 12, trunkX, y + (f.members.length - 1) * rowH);
            f.members.forEach(function (x) {
                p.line(trunkX, y, trunkX + 16, y);
                p.rect(trunkX + 22, y - 8, 16, 16, cmap[x.name]);
                p.text(trunkX + 46, y, m.det[x.name], { fill: '#444' });
                p.text(valRight, y, x.pct.toFixed(2) + '%', { fill: '#444', align: 'right' });
                y += rowH;
            });
        }
    });
    drawResidual(g, geo, m);
    return g;
}
/* 两列标注：左边一列派系、右边一列明细，中间用括号连起来 */
function buildCols(geo, cmap, m) {
    var g = [], p = pen(g, m), rowH = m.rowH;
    var x0 = geo.w - m.right + 34, nameX = x0 + 14;
    var facValRight = nameX + m.facW + 16 + m.vw;
    var brX = facValRight + 26, swX = brX + 24, detX = swX + 22;
    var valRight = detX + m.detW + 18 + m.vwd;
    var top = geo.cy - (rowCount() - 1) * rowH / 2, y = top;
    var fsHead = Math.max(12, m.fsDet - 4);
    p.text(x0, top - rowH - 4, '派系（合并一致行动人）', { fontSize: fsHead, fill: '#888' });
    p.text(swX, top - rowH - 4, '明细股东', { fontSize: fsHead, fill: '#888' });
    m.named.forEach(function (f) {
        var first = y, last = y + (f.members.length - 1) * rowH, mid = (first + last) / 2;
        p.poly(leaderPoints(geo, f.mid, mid, x0 - 30, x0 - 8));
        p.rect(x0, mid - 10, 6, 20, facFill(f));
        p.text(nameX, mid, m.fac[f.title],
               { fontSize: m.fsFac, fontWeight: 'bold', fill: '#4a2a5a' });
        p.text(facValRight, mid, f.value.toFixed(2) + '%',
               { fontSize: m.fsFac, fontWeight: 'bold', fill: '#6c3483', align: 'right' });
        if (f.members.length > 1) p.line(brX, first, brX, last);
        else p.line(facValRight + 8, mid, brX, mid);
        f.members.forEach(function (x) {
            p.line(brX, y, brX + 14, y);
            p.rect(swX, y - 8, 16, 16, cmap[x.name]);
            p.text(detX, y, m.det[x.name], { fill: '#444' });
            p.text(valRight, y, x.pct.toFixed(2) + '%', { fill: '#444', align: 'right' });
            y += rowH;
        });
    });
    drawResidual(g, geo, m);
    return g;
}
function render() {
    buildFacRows();
    var dom = chart.getDom();
    /* 画布高度也自适应：行少不留大片空白，行多不挤成一团 */
    var wantH = Math.max(460, Math.min(980, rowCount() * 38 + 130));
    if (Math.abs(dom.clientHeight - wantH) > 2) { dom.style.height = wantH + 'px'; chart.resize(); }
    var d = buildSeriesData(), w = chart.getWidth(), h = chart.getHeight();
    var m = metrics(w, h);
    var boxW = w - m.left - m.right;
    var cx = m.left + boxW / 2, cy = h / 2;
    var R = Math.max(70, Math.min(boxW / 2, h / 2 - 24));
    /* 外圈留窄环带、内圈厚一些；切换圈序时圆心与半径都不动 */
    var outBand = [R * 0.80, R * 0.98], inBand = [R * 0.44, R * 0.76];
    var facR = order === 'detail-in' ? outBand : inBand;
    var detR = order === 'detail-in' ? inBand : outBand;
    var a = 90;                       /* 12 点起顺时针，1% = 3.6°；引线起点靠它算 */
    FAC_ROWS.forEach(function (f) { var s = f.value * 3.6; f.mid = a - s / 2; a -= s; });
    function pie(radius, data) {
        return { type: 'pie', radius: radius, center: [cx, cy], startAngle: 90, sort: null,
                 label: { show: false }, labelLine: { show: false },
                 itemStyle: { borderColor: '#fff', borderWidth: 2 }, data: data,
                 z: 2, animation: false };
    }
    var geo = { cx: cx, cy: cy, R: R, rEdge: outBand[1], w: w };
    chart.setOption({
        backgroundColor: '#fff',
        tooltip: {
            trigger: 'item', textStyle: { fontSize: 16 },
            formatter: function (q) {
                var it = q.data;
                if (it._members) {
                    var sub = it._members.length > 1 ? '<br>' + it._members.map(function (x) {
                        return x.name + ' ' + x.pct.toFixed(2) + '%';
                    }).join('<br>') : '';
                    return '<b>派系</b> ' + q.name + '：' + q.value + '%（占总股本）' + sub;
                }
                return q.name + '：' + (+q.value).toFixed(2) + '%（占总股本）'
                    + '<br><span style="color:#888">派系：' + it._fac
                    + (it._tag ? '　' + it._tag : '') + '</span>';
            }
        },
        series: [pie(facR, d.fac), pie(detR, d.detail)],
        graphic: (layout === 'cols' ? buildCols : buildTree)(geo, d.cmap, m)
    }, true);
    /* 两列排布已经把清单搬到右侧，图下方的清单就不再重复 */
    document.getElementById('legend').style.display = layout === 'cols' ? 'none' : '';
}
/* 图下清单：派系一行，括号里列成员全称 */
function renderLegend() {
    document.getElementById('legend').innerHTML = FAC_ROWS.map(function (g) {
        var swatch = g.residual ? RESIDUAL_SWATCH_CSS
                   : (g.nominee ? NOMINEE_SWATCH_CSS : g.color);
        var items = g.members.map(function (x) { return x.name + ' ' + x.pct.toFixed(2) + '%'; })
                             .join('　');
        return '<div style="margin:3px 0"><span style="display:inline-block;width:12px;height:12px;'
            + 'border-radius:3px;background:' + swatch + ';vertical-align:-1px;margin-right:6px"></span>'
            + '<b style="color:#4a2a5a">' + g.title + '</b> '
            + '<span style="color:#6c3483;font-weight:600">' + g.value.toFixed(2) + '%</span>'
            + (g.members.length > 1 ? '　<span style="color:#777">（' + items + '）</span>' : '')
            + '</div>';
    }).join('');
}
function onBtnClick(e) {
    var b = e.target.closest('button');
    if (!b) return;
    ['order', 'mode', 'layout', 'ds'].forEach(function (k) {
        if (!b.hasAttribute('data-' + k)) return;
        var v = b.getAttribute('data-' + k);
        if (k === 'order') order = v;
        else if (k === 'mode') mode = v;
        else if (k === 'layout') layout = v;
        else ds = v;
        document.querySelectorAll('[data-' + k + ']').forEach(function (x) {
            x.classList.toggle('active', x.getAttribute('data-' + k) === v);
        });
    });
    render();
    renderLegend();
}
document.getElementById('btns').addEventListener('click', onBtnClick);
document.getElementById('btns2').addEventListener('click', onBtnClick);
window.addEventListener('resize', function () { chart.resize(); render(); });
render();
renderLegend();
</script>
