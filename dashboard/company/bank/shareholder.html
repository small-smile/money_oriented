<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../common/base.css">
    <link rel="stylesheet" href="../page.css">
    <link rel="stylesheet" href="../shareholder.css">
    <title>股权结构（各板块共用一页）</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        /* 全站只剩这一份股权结构页：正文、图、表对所有板块完全一样，**只有顶部 header 不同** ——
         * 银行走 bank-header.js（银行页链接簇 + 45 家下拉切换，本页就在 bank/ 目录下，
         * 它那套相对路径正好对得上），其余板块走 site-header.js 并用 window.__HEADER_GROUP
         * 指定用哪一组链接（site-header.js 原本按目录判板块，这一页判不出来）。
         * 食品板块没有行业页分组，就只留 shareholder.js 自己画的那条切换行。
         * 板块与公司的切换行始终由 shareholder.js 的 buildNav 画，与 header 各管一层。 */
        (function () {
            var ind = new URLSearchParams(location.search).get('industry') || 'bank';
            var GROUP = {insurer: 'industry/insurance/', developer: 'industry/realestate/',
                cement: 'industry/cement/', telecom: 'industry/telecom/', tech: 'company/baidu/'};
            if (ind !== 'bank' && !GROUP[ind]) return;
            if (ind !== 'bank') window.__HEADER_GROUP = GROUP[ind];
            var s = document.createElement('script');
            s.src = ind === 'bank' ? '../../common/bank-header.js' : '../../common/site-header.js';
            s.defer = true;
            document.head.appendChild(s);
        })();
    </script>
</head>
<body>
<div class="wrap">
    <div class="page-head">
        <h1 id="page-title" data-page="股东">股权结构</h1>
        <div class="meta" id="page-meta"></div>
        <div class="tags"><span>前十名股东</span><span>持股集中度</span><span>增减动向</span><span id="tag-extra" hidden>股东户数</span></div>
    </div>

    <div id="loading">加载中…（需先启动 backend_python.py，端口 5000）</div>
    <div id="error-msg"></div>

    <section id="sec-kpi" hidden>
        <h2 id="kpi-title">股东结构概览</h2>
        <p class="sub" id="kpi-sub"></p>
        <div class="kpis" id="kpis"></div>
        <div class="entity" id="entity-note"></div>
    </section>

    <!-- 双层环形图：内圈一名股东一块、外圈按分组归并，圈序可互换。版面（行高、字号、列宽、
         圆环半径、画布高度）全部由数据量与文字实测宽度算出，这里只给一个空容器 -->
    <section id="sec-ring" hidden>
        <div class="ring-hd">
            <h2 style="margin-bottom:0">股东结构环形图</h2>
            <button type="button" id="btn-order" title="点一下两圈互换">内圈：股东明细</button>
        </div>
        <p class="sub" id="ring-sub"></p>
        <div class="chart-card" style="padding:8px 10px 14px">
            <div id="chart-ring" style="height:640px"></div>
        </div>
        <div class="note" id="ring-note" style="max-width:1100px;color:#6b7280;font-size:16px"></div>
    </section>

    <div id="charts"></div>

    <section id="sec-table" hidden>
        <h2>前十名股东明细</h2>
        <p class="sub" id="tbl-sub"></p>
        <div style="overflow-x:auto">
            <table>
                <thead><tr id="tbl-head"></tr></thead>
                <tbody id="tbl-body"></tbody>
                <tfoot id="tbl-foot"></tfoot>
            </table>
        </div>
    </section>

    <section id="sec-gaps" hidden>
        <h2>口径与接口限制</h2>
        <p class="sub">名册口径、缺失年份与穿透不了的名义持有人逐条列出，本页不做推算</p>
        <ul class="gap-list" id="gaps"></ul>
    </section>
</div>
<!-- 点击环形图右侧标注行时在那一行下面弹出全称（列里的名字是按实测宽度截断的） -->
<div id="row-full"></div>
<!-- 股东明细弹层：点图上「股东明细」出全量长名清单，含所属分组与色块 -->
<div class="modal" id="det-modal">
    <div class="modal-box">
        <div class="modal-hd">
            <button type="button" id="det-close" title="关闭">&#10005;</button>
        </div>
        <div id="det-body"></div>
    </div>
</div>
<script src="../shareholder.js"></script>
</body>
</html>
