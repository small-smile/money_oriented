<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../common/base.css">
    <script src="../common/site-header.js" defer></script>
    <title>中石油 2024 资产负债表（示例）：资产 = 负债 + 所有者权益</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f5f7fa;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            min-height: 100vh; overflow-y: auto;
            padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .site-nav { margin: -16px -16px 0; }
        .chart-box {
            width: 100%; max-width: 1800px; margin: 0 auto; height: 140vh; flex-shrink: 0;
            background: #fff; border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
<div id="chart-bs" class="chart-box"></div>
<script>
/* ────── 中石油 2024 年末合并资产负债表（示例数据，单位：百万元人民币） ──────
   数据结构对齐 20-F：资产按「流动 / 非流动」拆分；负债与权益按「流动负债 /
   非流动负债 / 归母权益 / 少数股东权益」拆分。数值仅为量级示意，非官方口径。
                                                                    */
const assets = [
    // ── 流动资产 ──
    { name: '货币资金及现金等价物',   value: 165000, group: 'CA' },
    { name: '应收账款及票据',         value:  85000, group: 'CA' },
    { name: '存货',                   value: 175000, group: 'CA' },
    { name: '其他流动资产',           value:  60000, group: 'CA' },
    // ── 非流动资产 ──
    { name: '油气资产（净值）',       value: 980000, group: 'NCA' },
    { name: '其他固定资产（净值）',   value: 520000, group: 'NCA' },
    { name: '在建工程',               value: 175000, group: 'NCA' },
    { name: '长期股权投资',           value: 245000, group: 'NCA' },
    { name: '无形资产及商誉',         value:  95000, group: 'NCA' },
    { name: '递延所得税资产',         value:  30000, group: 'NCA' },
    { name: '其他非流动资产',         value: 170000, group: 'NCA' }
];

const claims = [
    // ── 流动负债 ──
    { name: '短期借款',               value:  95000, group: 'CL'  },
    { name: '应付账款及票据',         value: 260000, group: 'CL'  },
    { name: '应交税费',               value:  85000, group: 'CL'  },
    { name: '一年内到期的非流动负债', value:  60000, group: 'CL'  },
    { name: '其他流动负债',           value: 150000, group: 'CL'  },
    // ── 非流动负债 ──
    { name: '长期借款',               value: 145000, group: 'NCL' },
    { name: '应付债券',               value:  95000, group: 'NCL' },
    { name: '递延所得税负债',         value:  40000, group: 'NCL' },
    { name: '其他非流动负债',         value: 130000, group: 'NCL' },
    // ── 所有者权益 ──
    { name: '归属母公司所有者权益',   value: 1520000, group: 'EQP' },
    { name: '少数股东权益',           value:  120000, group: 'EQM' }
];

/* ────── 颜色：资产侧偏蓝，负债侧偏红，权益侧偏绿 ────── */
const COLOR = {
    CA:  '#7fb3e0',   // 流动资产
    NCA: '#1a4d7a',   // 非流动资产
    CL:  '#e89999',   // 流动负债
    NCL: '#c94a4a',   // 非流动负债
    EQP: '#1a7a3a',   // 归母权益
    EQM: '#7fc48c'    // 少数股东权益
};
const GROUP_LABEL = {
    CA: '流动资产', NCA: '非流动资产',
    CL: '流动负债', NCL: '非流动负债',
    EQP: '归母权益', EQM: '少数股东权益'
};

const totalAssets = assets.reduce((s, it) => s + it.value, 0);
const totalClaims = claims.reduce((s, it) => s + it.value, 0);

/* 两根柱：column 0 = 资产，column 1 = 负债+权益。
   每个明细项目一个 series，按顺序 stack 到对应列。 */
const CATEGORIES = ['资产', '负债 + 所有者权益'];
const NAME2GROUP = {};   // seriesName → group key，供 tooltip 查询
function makeSeries(items, colIdx) {
    return items.map(it => {
        NAME2GROUP[it.name] = it.group;
        return {
            name: it.name,
            type: 'bar',
            stack: 'bs',
            barMaxWidth: 220,
            itemStyle: { color: COLOR[it.group], borderColor: '#fff', borderWidth: 1 },
            emphasis: { focus: 'series' },
            data: CATEGORIES.map((_, i) => i === colIdx ? it.value : '-')
        };
    });
}
const series = [...makeSeries(assets, 0), ...makeSeries(claims, 1)];

/* 标签只在每段中点显示（避免小段挤压），并显示金额及占总比 */
series.forEach(s => {
    const total = s.data[0] !== '-' ? totalAssets : totalClaims;
    s.label = {
        show: true,
        position: 'inside',
        color: '#fff',
        fontSize: 11,
        fontWeight: 500,
        formatter: p => {
            const v = p.value;
            if (v === '-' || v == null) return '';
            const pct = (v / total * 100);
            // 小于总额 2% 的段位不显示文字，避免重叠
            if (pct < 2) return '';
            return `${p.seriesName}  ${Number(v).toLocaleString()}  (${pct.toFixed(1)}%)`;
        }
    };
});

const chart = echarts.init(document.getElementById('chart-bs'));
chart.setOption({
    backgroundColor: '#ffffff',
    title: {
        text: '中石油 2024 年末资产负债表（示例）：资产 = 负债 + 所有者权益',
        subtext: `示意数据 · 单位：百万元人民币 | 左柱按「流动 / 非流动」自下而上堆叠；`
               + `右柱按「流动负债 → 非流动负债 → 归母权益 → 少数股东权益」自下而上堆叠 | `
               + `合计：资产 ${totalAssets.toLocaleString()}，负债+权益 ${totalClaims.toLocaleString()}`,
        left: 'center', top: 8,
        textStyle: { color: '#1a1a2e', fontSize: 15 },
        subtextStyle: { color: '#666', fontSize: 11 }
    },
    tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        position: (point, params, dom, rect, size) => {
            const [x] = point;
            const tw = size.contentSize[0];
            const vw = size.viewSize[0];
            return [x + 16 + tw > vw ? x - tw - 16 : x + 16, 16];
        },
        formatter: params => {
            if (!params || !params.length) return '';
            const colName = params[0].name;
            const total = colName === '资产' ? totalAssets : totalClaims;
            // 只保留当前列真实有值的段
            const real = params.filter(p => p.value !== '-' && p.value != null);
            // 分组汇总
            const byGroup = {};
            real.forEach(p => {
                const key = NAME2GROUP[p.seriesName] || '其他';
                (byGroup[key] = byGroup[key] || []).push(p);
            });
            let html = `<div style="font-weight:600;margin-bottom:4px">${colName}　总计 ${total.toLocaleString()}</div>`;
            Object.keys(byGroup).forEach(k => {
                const sum = byGroup[k].reduce((s, p) => s + p.value, 0);
                html += `<div style="margin-top:4px;font-weight:600;color:${COLOR[k]}">`
                     +  `▍${GROUP_LABEL[k] || k}　${sum.toLocaleString()}　(${(sum/total*100).toFixed(1)}%)</div>`;
                byGroup[k].forEach(p => {
                    html += `<div style="padding-left:12px;font-size:12px">`
                         +  `${p.marker}${p.seriesName}：<b>${Number(p.value).toLocaleString()}</b> `
                         +  `<span style="color:#888">(${(p.value/total*100).toFixed(1)}%)</span></div>`;
                });
            });
            return html;
        }
    },
    legend: {
        type: 'scroll',
        bottom: 56,
        textStyle: { fontSize: 11, color: '#333' },
        itemWidth: 12, itemHeight: 10
    },
    dataZoom: [
        {
            type: 'slider',
            xAxisIndex: 0,
            bottom: 30,
            height: 20,
            startValue: 0,
            endValue: totalAssets,
            showDetail: false
        }
    ],
    grid: { left: 160, right: 80, top: 78, bottom: 90 },
    yAxis: {
        type: 'category',
        data: CATEGORIES,
        inverse: true,
        axisLabel: { color: '#222', fontSize: 14, fontWeight: 600 },
        axisLine: { lineStyle: { color: '#bbb' } }
    },
    xAxis: {
        type: 'value',
        name: '金额（百万元）',
        nameTextStyle: { color: '#555' },
        axisLabel: { color: '#555', formatter: v => (v / 1000).toFixed(0) + 'k' },
        splitLine: { lineStyle: { color: '#e8e8e8' } },
        min: 0
    },
    series: series
});

/* 顶部标注：在两根柱顶端画出总计（用 markPoint 附加到最后一个 series） */
const topAsset = series.filter(s => s.data[0] !== '-').slice(-1)[0];
const topClaim = series.filter(s => s.data[1] !== '-').slice(-1)[0];
topAsset.markPoint = {
    symbol: 'roundRect', symbolSize: [140, 26], symbolOffset: [18, 0],
    itemStyle: { color: '#1a4d7a' },
    label: {
        show: true, color: '#fff', fontWeight: 700, fontSize: 12,
        formatter: `资产总计  ${totalAssets.toLocaleString()}`
    },
    data: [{ coord: [totalAssets, '资产'] }]
};
topClaim.markPoint = {
    symbol: 'roundRect', symbolSize: [170, 26], symbolOffset: [18, 0],
    itemStyle: { color: '#1a7a3a' },
    label: {
        show: true, color: '#fff', fontWeight: 700, fontSize: 12,
        formatter: `负债+权益 合计  ${totalClaims.toLocaleString()}`
    },
    data: [{ coord: [totalClaims, '负债 + 所有者权益'] }]
};
chart.setOption({ series });

window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
