<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../common/base.css">
    <script src="../../common/site-header.js" defer></script>
    <title>上市银行息差与不良生成横向对比</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { padding: 0; background: #f5f6f8; }
        .page { max-width: 1800px; margin: 0 auto; padding: 20px 16px 48px; }
        h1 { text-align: center; color: #2c3e50; font-size: 29px; margin: 12px 0 6px; }
        .lede { text-align: center; color: #6b7280; font-size: 17px; margin-bottom: 16px; }
        .lede b { color: #b45309; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
        .toolbar button {
            border: 1px solid #cbd5e1; background: #fff; color: #374151;
            font-size: 15px; padding: 5px 14px; border-radius: 16px; cursor: pointer;
            transition: background 0.12s, color 0.12s, border-color 0.12s;
        }
        .toolbar button:hover { border-color: #94a3b8; }
        .toolbar button.active { background: #1f2937; color: #fff; border-color: #1f2937; }
        /* 指标切换排：更醒目一档，与下方类型筛选区分开 */
        .metricbar { margin-bottom: 8px; }
        .metricbar button { font-size: 16px; padding: 6px 18px; border-color: #94a3b8; }
        .metricbar button.active { background: #b45309; border-color: #b45309; }
        .chart-card { padding: 16px 18px 22px; margin-bottom: 22px; background: #fff;
                      border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .chart-box { height: 78vh; min-height: 520px; }
        .note { font-size: 16px; color: #6b7280; line-height: 1.7; margin-top: 10px; }
        .note b { color: #b45309; }
        details.note-more { margin-top: 6px; }
        details.note-more > summary { cursor: pointer; color: #1d4ed8; font-size: 15px; }
        details.note-more > div { margin-top: 6px; padding-left: 10px; border-left: 3px solid #e5e7eb; }
        a { color: #1d4ed8; }
        #loading, #error-msg { text-align: center; color: #6b7280; font-size: 17px; padding: 40px 0; }
        #error-msg { display: none; color: #b91c1c; }
    </style>
</head>
<body>
<div class="page">
    <h1>上市银行息差与不良生成横向对比</h1>
    <div class="lede">
        44 家已建数据页的 A/H 股上市银行 · <b>净息差 NIM／净利差 NIS</b>（利息业务盈利厚度）与<b>不良生成率</b>（新增不良速度）两组风控核心指标横向对比<br>
        先选指标、再选机构类型；息差为年报披露值，不良生成率依赖 IFRS9 后的「信用减值损失」科目、各行统一自 2018 年起可比。按机构类型分色，点按按钮可只看某一类
    </div>

    <div class="toolbar metricbar" id="metricbar"></div>
    <div class="toolbar" id="toolbar"></div>

    <div id="loading">加载中…（需先启动 backend_python.py，端口 5000）</div>
    <div id="error-msg"></div>
    <div class="chart-card" id="card" style="display:none">
        <div class="chart-box" id="chart"></div>
        <div class="note" id="note"></div>
    </div>
</div>

<script src="npl-formation.js"></script>
</body>
</html>
