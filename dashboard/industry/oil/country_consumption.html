<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../common/base.css">
    <script src="../../common/site-header.js" defer></script>
    <title>石油消费总览（1965-2024）</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f5f7fa;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }
        #content { width: 100%; max-width: 1800px; margin: 0 auto; padding: 20px 24px 40px; }
        #chart-stack { width: 100%; height: 760px; }
        #detail-wrap {
            display: none;
            width: 100%;
            height: 222px;
            margin-top: 12px;   /* 与上方堆叠卡分开，各自成圆角卡片 */
        }
        #detail-title {
            text-align: center;
            font-size: 16px;
            color: #333;
            padding: 3px 0 0;
            height: 22px;
            line-height: 22px;
        }
        #chart-detail { width: 100%; height: 200px; }
        #loading { text-align: center; padding: 60px; color: #666; font-size: 16px; }
        #error-msg { display: none; text-align: center; padding: 20px; color: #d32f2f; font-size: 16px; }

        /* ── 分产品消费量卡片 ── */
        /* 圆角/投影/白底见 common/base.css 的 .chart-card */
        #product-card { display: none; margin-top: 24px; padding-bottom: 12px; }
        #chart-product { width: 100%; height: 620px; }
        .btn-row {
            display: flex; flex-wrap: wrap; gap: 6px;
            padding: 8px 16px 4px; align-items: center;
        }
        .btn-row .label { font-size: 16px; color: #555; margin-right: 4px; }
        .btn-row button {
            font-size: 16px; padding: 4px 12px; cursor: pointer;
            background: #f3f4f6; color: #374151;
            border: 1px solid #d1d5db; border-radius: 4px;
            font-family: inherit;
        }
        .btn-row button:hover { background: #e5e7eb; }
        .btn-row button.active {
            background: #1f2937; color: #fff; border-color: #1f2937; font-weight: 600;
        }
        .btn-row .spacer { flex: 1; }
    </style>
</head>
<body>
<div id="loading">数据加载中...</div>
<div id="error-msg"></div>
<div id="content">
    <div id="stack-wrap" class="chart-card" style="display:none">
        <h2 class="chart-title">各国石油消费量堆叠图（1965-2024）<span class="sub">悬浮到某层切换底部详情 | 同洲同色 | 单位：千桶/日</span></h2>
        <div id="chart-stack"></div>
    </div>
    <div id="detail-wrap" class="chart-card">
        <div id="detail-title"></div>
        <div id="chart-detail"></div>
    </div>
    <div id="product-card" class="chart-card">
        <h2 class="chart-title">分产品消费量（1980-2024）<span class="sub">汽油 / 柴油 / 航空煤油 / 石脑油 | 点击按钮切换地区与口径 | 来源：EI Statistical Review 2025</span></h2>
        <div class="btn-row" id="region-btns"><span class="label">地区</span></div>
        <div class="btn-row" id="mode-btns"><span class="label">口径</span></div>
        <div id="chart-product"></div>
    </div>
</div>
<script>
const REGION_COLORS = {
    'North America':      '#5470c6',
    'CIS':                '#fac858',
    'Middle East':        '#ee6666',
    'S. & Cent. America': '#91cc75',
    'Africa':             '#fc8452',
    'Asia Pacific':       '#73c0de',
    'Europe':             '#9a60b4'
};

function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error-msg');
    el.style.display = 'block';
    el.textContent = '加载失败：' + msg + '（请确保 Flask 后端已启动）';
}

let _years, _allData, _meta;
let detailChart = null;
let currentCountry = null;

axios.get('http://127.0.0.1:5000/api/consumption_region')
    .then(res => {
        if (res.data.code !== 200) { showError(res.data.msg || '未知错误'); return; }
        const d = res.data.data;
        _years   = d.years;
        _allData = d.country_all_data;
        _meta    = d.country_meta;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('stack-wrap').style.display = 'block';
        renderStack(d.years, d.sorted_countries, d.country_all_data, d.country_meta);
        // 默认展示第一个国家
        const first = d.sorted_countries[0];
        currentCountry = first;
        showDetail(first);
    })
    .catch(err => showError(err.message));

function renderStack(years, sortedCountries, allData, meta) {
    const chart = echarts.init(document.getElementById('chart-stack'));

    const series = sortedCountries.map(c => {
        const baseColor = REGION_COLORS[meta[c].continent] || '#888';
        return {
            name: c,
            type: 'line',
            stack: 'total',
            areaStyle: { opacity: 0.65 },
            data: allData[c],
            smooth: true,
            showSymbol: false,
            connectNulls: true,
            lineStyle: { width: 0.5 },
            itemStyle: { color: baseColor },
            emphasis: { focus: 'series', areaStyle: { opacity: 1 } }
        };
    });

    chart.setOption({
        backgroundColor: '#ffffff',
        tooltip: {
            trigger: 'axis',
            position: [12, 12],
            axisPointer: { type: 'cross', lineStyle: { width: 2 } },
            formatter: params => {
                let html = `<b>${params[0].axisValue} 年</b><br>`;
                const items = params.filter(p => p.value != null && p.value > 0)
                                    .sort((a, b) => b.value - a.value);
                const cur = items.find(p => p.seriesName === currentCountry);
                if (cur) {
                    html += `${cur.marker}<b>${cur.seriesName}: ${cur.value.toLocaleString()}</b> ← 当前<br>`;
                    html += `<hr style="margin:3px 0;border-color:#ddd">`;
                }
                items.filter(p => p.seriesName !== currentCountry)
                     .slice(0, 8)
                     .forEach(p => {
                         html += `${p.marker}${p.seriesName}: <b>${p.value.toLocaleString()}</b><br>`;
                     });
                if (items.length > 9) html += `…（共 ${items.length} 条）`;
                return html;
            }
        },
        legend: {
            data: sortedCountries, type: 'scroll', top: 36,
            textStyle: { fontSize: 11 },
            formatter: name => {
                const m = meta[name];
                const sign = m.change >= 0 ? '+' : '';
                return `${name} (${sign}${m.change.toLocaleString()})`;
            }
        },
        grid: { left: 64, right: 20, top: 96, bottom: 40 },
        toolbox: { feature: { saveAsImage: {}, dataZoom: { yAxisIndex: 'none' }, restore: {} }, right: 10, top: 8 },
        // 不加 dataZoom：60 个年度点一次画全，看局部用 toolbox 的框选缩放
        xAxis: {
            type: 'category', data: years, boundaryGap: false,
            axisLabel: { color: '#555' }, axisLine: { lineStyle: { color: '#bbb' } }
        },
        yAxis: {
            type: 'value', name: '千桶/日',
            nameTextStyle: { color: '#555' },
            axisLabel: { color: '#555', formatter: v => (v/1000).toFixed(0) + 'k' },
            splitLine: { lineStyle: { color: '#e8e8e8' } }
        },
        series
    });

    const chartDom = document.getElementById('chart-stack');
    chartDom.addEventListener('mousemove', e => {
        const rect = chartDom.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;

        const dataCoord = chart.convertFromPixel('grid', [px, py]);
        if (!dataCoord) return;
        const xi = Math.round(dataCoord[0]);
        if (xi < 0 || xi >= years.length) return;

        let cumulative = 0;
        let hit = null;
        for (let si = 0; si < sortedCountries.length; si++) {
            const c = sortedCountries[si];
            const val = allData[c][xi] || 0;
            const prevCum = cumulative;
            cumulative += val;
            const botPx = chart.convertToPixel('grid', [xi, prevCum])[1];
            const topPx = chart.convertToPixel('grid', [xi, cumulative])[1];
            if (py >= topPx && py <= botPx) {
                hit = c;
                break;
            }
        }

        if (hit && hit !== currentCountry) {
            currentCountry = hit;
            showDetail(hit);
        }
    });

    window.addEventListener('resize', () => {
        chart.resize();
        if (detailChart) detailChart.resize();
    });

    const observer = new ResizeObserver(() => chart.resize());
    observer.observe(document.getElementById('chart-stack'));
}

function showDetail(country) {
    const wrap = document.getElementById('detail-wrap');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    document.getElementById('detail-title').textContent =
        `${country}（${_meta[country].continent}）— 独立消费量走势（千桶/日）`;

    if (!detailChart) {
        detailChart = echarts.init(document.getElementById('chart-detail'));
    }

    const color = REGION_COLORS[_meta[country].continent] || '#5470c6';

    detailChart.setOption({
        backgroundColor: '#fafafa',
        tooltip: { trigger: 'axis', axisPointer: { type: 'cross', lineStyle: { width: 1 } } },
        grid: { left: 56, right: 16, top: 12, bottom: 40 },
        // 不用 inside dataZoom：只要存在 inside，ECharts 就会 preventDefault 滚轮事件，页面无法下滚
        xAxis: {
            type: 'category', data: _years, boundaryGap: false,
            axisLabel: { color: '#555', fontSize: 10 },
            axisLine: { lineStyle: { color: '#bbb' } }
        },
        yAxis: {
            type: 'value',
            axisLabel: { color: '#555', fontSize: 10, formatter: v => (v/1000).toFixed(0) + 'k' },
            splitLine: { lineStyle: { color: '#eee' } }
        },
        series: [{
            type: 'line',
            data: _allData[country],
            smooth: true,
            showSymbol: false,
            connectNulls: true,
            areaStyle: { color, opacity: 0.15 },
            lineStyle: { color, width: 2 },
            itemStyle: { color }
        }]
    }, true);
}

// ══════════════ 分产品消费量（EI: Oil - Regional Consumption） ══════════════
const PRODUCT_COLORS = {
    '汽油':     '#5470c6',
    '柴油':     '#ee6666',
    '航空煤油': '#3ba272',
    '石脑油':   '#fac858'
};

// 源表 17 个区块，按"总量→大区→重点国家"排列，中文标签只用于按钮和图例
const REGION_LABELS = {
    'World': '全球', 'OECD': 'OECD', 'Non-OECD': '非 OECD',
    'North America': '北美', 'US': '美国',
    'S. & Cent. America': '中南美', 'Brazil': '巴西',
    'Europe': '欧洲', 'European Union': '欧盟',
    'CIS': '独联体', 'USSR': '苏联',
    'Middle East': '中东', 'Africa': '非洲',
    'Asia Pacific': '亚太', 'China': '中国', 'India': '印度', 'Japan': '日本'
};
const REGION_ORDER = Object.keys(REGION_LABELS);

let _pd = null;                 // 接口返回的 data
let productChart = null;
let curRegion = 'World';
let curMode = 'abs';            // abs = 千桶/日, share = 占本地区石油消费 %

axios.get('http://127.0.0.1:5000/api/consumption_product')
    .then(res => {
        if (res.data.code !== 200) { showError(res.data.msg || '未知错误'); return; }
        _pd = res.data.data;
        document.getElementById('product-card').style.display = 'block';
        buildProductButtons();
        renderProduct();
    })
    .catch(err => showError(err.message));

function buildProductButtons() {
    const rWrap = document.getElementById('region-btns');
    REGION_ORDER.filter(r => _pd.regions.includes(r)).forEach(r => {
        const b = document.createElement('button');
        b.textContent = REGION_LABELS[r];
        b.dataset.region = r;
        if (r === curRegion) b.classList.add('active');
        b.addEventListener('click', () => {
            curRegion = r;
            rWrap.querySelectorAll('button').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            renderProduct();
        });
        rWrap.appendChild(b);
    });

    const mWrap = document.getElementById('mode-btns');
    [['abs', '绝对量（千桶/日）'], ['share', '占本地区石油消费（%）']].forEach(([mode, text]) => {
        const b = document.createElement('button');
        b.textContent = text;
        if (mode === curMode) b.classList.add('active');
        b.addEventListener('click', () => {
            curMode = mode;
            mWrap.querySelectorAll('button').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            renderProduct();
        });
        mWrap.appendChild(b);
    });
}

function renderProduct() {
    if (!productChart) {
        productChart = echarts.init(document.getElementById('chart-product'));
        window.addEventListener('resize', () => productChart.resize());
        new ResizeObserver(() => productChart.resize())
            .observe(document.getElementById('chart-product'));
    }

    const share = curMode === 'share';
    const src = share ? _pd.region_shares[curRegion] : _pd.region_products[curRegion];
    const unit = share ? '%' : '千桶/日';

    const series = _pd.products.map(p => {
        const color = PRODUCT_COLORS[p];
        return {
            name: p,
            type: 'line',
            data: src[p],
            smooth: true,
            showSymbol: false,
            connectNulls: false,     // 苏联 1985 后断档，不能连
            lineStyle: { color, width: 2.5 },
            itemStyle: { color },
            endLabel: {
                show: true, fontSize: 16, color,
                formatter: pm => pm.value == null ? '' :
                    `${p} ${share ? pm.value.toFixed(1) + '%' : pm.value.toLocaleString()}`
            }
        };
    });

    productChart.setOption({
        backgroundColor: '#ffffff',
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross', lineStyle: { width: 2 } },
            textStyle: { fontSize: 16 },
            formatter: params => {
                let html = `<b>${params[0].axisValue} 年 · ${REGION_LABELS[curRegion]}</b><br>`;
                params.filter(p => p.value != null)
                      .sort((a, b) => b.value - a.value)
                      .forEach(p => {
                          const v = share ? p.value.toFixed(2) + '%' : p.value.toLocaleString();
                          html += `${p.marker}${p.seriesName}: <b>${v}</b><br>`;
                      });
                return html;
            }
        },
        legend: {
            data: _pd.products, top: 8, textStyle: { fontSize: 16 }
        },
        // endLabel 写在线尾，右侧留白给它
        grid: { left: 88, right: 150, top: 52, bottom: 40 },
        toolbox: { feature: { saveAsImage: {}, dataZoom: { yAxisIndex: 'none' }, restore: {} }, right: 10, top: 8 },
        // 不加 dataZoom：45 个年度点一次画全，看局部用 toolbox 的框选缩放
        xAxis: {
            type: 'category', data: _pd.years, boundaryGap: false,
            axisLabel: { color: '#555', fontSize: 16 },
            axisLine: { lineStyle: { color: '#bbb' } }
        },
        yAxis: {
            type: 'value', name: unit,
            min: 0,                  // 消费量有意义的 0 基线，不做截断放大
            nameTextStyle: { color: '#555', fontSize: 16 },
            axisLabel: {
                color: '#555', fontSize: 16,
                formatter: v => share ? v + '%' : (v / 1000).toFixed(0) + 'k'
            },
            splitLine: { lineStyle: { color: '#e8e8e8' } }
        },
        series
    }, true);
}
</script>
</body>
</html>
