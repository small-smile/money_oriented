<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../common/base.css">
    <script src="../../common/site-header.js" defer></script>
    <title>各洲石油产量对比：2001 vs 2024</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f5f7fa; font-family: Arial, "Microsoft YaHei", sans-serif; }
        #loading { text-align: center; padding: 60px; color: #666; font-size: 16px; }
        #error-msg { display: none; text-align: center; padding: 20px; color: #d32f2f; font-size: 16px; }
        /* 圆角/投影/白底见 common/base.css 的 .chart-card，这里只加卡片间距 */
        .chart-block { width: 100%; margin-bottom: 24px; }
        #container { max-width: 1800px; margin: 0 auto; padding: 20px 24px 40px; }
    </style>
</head>
<body>
<div id="loading">数据加载中...</div>
<div id="error-msg"></div>
<div id="container"></div>
<script>
const CONT_COLOR = {
    'Africa':             '#fc8452',
    'Asia Pacific':       '#73c0de',
    'CIS':                '#fac858',
    'Europe':             '#9a60b4',
    'Middle East':        '#ee6666',
    'North America':      '#5470c6',
    'S. & Cent. America': '#91cc75'
};

function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error-msg');
    el.style.display = 'block';
    el.textContent = '加载失败：' + msg + '（请确保 Flask 后端已启动）';
}

axios.get('http://127.0.0.1:5000/api/production_region')
    .then(res => {
        if (res.data.code !== 200) { showError(res.data.msg || '未知错误'); return; }
        document.getElementById('loading').style.display = 'none';
        render(res.data.data.country_compare);
    })
    .catch(err => showError(err.message));

function render(compare) {
    const continents = Object.keys(compare);
    const container  = document.getElementById('container');

    // 计算全局最大值（2001 和 2024 中的最大），统一 X 轴刻度
    let globalMax = 0;
    continents.forEach(cont => {
        compare[cont].forEach(e => {
            globalMax = Math.max(globalMax, e.v2001, e.v2024);
        });
    });
    // 向上取整到整千
    globalMax = Math.ceil(globalMax / 1000) * 1000;

    // 收集所有 chart，斜线图案就绪后统一回填
    const charts = [];

    // 生成斜线纹理 dataURL，转为 ECharts 可用的 image pattern
    const patternCanvas = document.createElement('canvas');
    patternCanvas.width = 10;
    patternCanvas.height = 10;
    const pCtx = patternCanvas.getContext('2d');
    pCtx.fillStyle = '#f0f0f0';
    pCtx.fillRect(0, 0, 10, 10);
    pCtx.strokeStyle = '#999';
    pCtx.lineWidth = 1.5;
    pCtx.beginPath(); pCtx.moveTo(0, 10); pCtx.lineTo(10, 0); pCtx.stroke();
    pCtx.beginPath(); pCtx.moveTo(-2, 2);  pCtx.lineTo(2, -2);  pCtx.stroke();
    pCtx.beginPath(); pCtx.moveTo(8, 12);  pCtx.lineTo(12, 8);  pCtx.stroke();
    const stripeImg = new Image();
    const stripePattern = {
        image: stripeImg,
        repeat: 'repeat'
    };
    // 图案是异步解码的：图片就绪前用它填充会画成空白（柱子和 legend 标记都是），
    // 解码完成后把"减少"系列的系列级 itemStyle 和 data 都重新 setOption 一次，纹理才会显示
    stripeImg.onload = () => {
        charts.forEach(({ chart, losses }) => {
            chart.setOption({ series: [{}, {}, {
                itemStyle: { color: stripePattern },
                data: losses.map(v => ({ value: v, itemStyle: { color: stripePattern } }))
            }] });
        });
    };
    stripeImg.src = patternCanvas.toDataURL();

    continents.forEach(cont => {
        const entries = [...compare[cont]].sort((a, b) => b.v2024 - a.v2024);
        const color   = CONT_COLOR[cont] || '#888';

        const countries = entries.map(e => e.country);
        const base      = entries.map(e => Math.min(e.v2001, e.v2024));
        const gains     = entries.map(e => Math.max(0, e.v2024 - e.v2001));
        const losses    = entries.map(e => Math.max(0, e.v2001 - e.v2024));
        const meta = entries.map(e => ({
            v2001: e.v2001, v2024: e.v2024,
            diff: parseFloat((e.v2024 - e.v2001).toFixed(1)),
            pct: Math.max(e.v2001, e.v2024) > 0
                ? ((e.v2024 - e.v2001) / Math.max(e.v2001, e.v2024) * 100).toFixed(1)
                : null
        }));

        // 图高自适应国家数
        const h = Math.max(260, countries.length * 32 + 120);
        const block = document.createElement('div');
        block.className = 'chart-block chart-card';
        // 标题用 HTML 文本（可选中复制），不用 ECharts title
        const titleEl = document.createElement('h2');
        titleEl.className = 'chart-title';
        titleEl.style.cssText = `text-align:left;padding:10px 0 0 16px;color:${color}`;
        titleEl.textContent = cont;
        block.appendChild(titleEl);
        const div = document.createElement('div');
        div.style.width = '100%';
        div.style.height = h + 'px';
        block.appendChild(div);
        container.appendChild(block);

        const chart = echarts.init(div);
        charts.push({ chart, losses });
        chart.setOption({
            backgroundColor: '#ffffff',
            tooltip: {
                trigger: 'axis',
                textStyle: { fontSize: 16 },
                axisPointer: { type: 'shadow' },
                formatter: params => {
                    const name = params[0].axisValue;
                    const i    = countries.indexOf(name);
                    if (i < 0) return '';
                    const m    = meta[i];
                    const sign = m.diff >= 0 ? '+' : '';
                    const pctStr = m.pct !== null ? `（${sign}${m.pct}%）` : '';
                    return `<b>${name}</b><br>
                            2001：<b>${m.v2001.toLocaleString()}</b> 千桶/日<br>
                            2024：<b>${m.v2024.toLocaleString()}</b> 千桶/日<br>
                            变化：<b>${sign}${m.diff.toLocaleString()}</b> ${pctStr}`;
                }
            },
            legend: {
                data: ['保留', '增加', '减少'],
                top: 8, right: 20,
                itemGap: 20,
                textStyle: { color: '#333', fontSize: 16 }
            },
            /* 左右留白按 16px 字号给：'Other Southern Africa' 这类长国名和 ±数值都要放得下 */
            grid: { left: 210, right: 96, top: 40, bottom: 30 },
            xAxis: {
                type: 'value',
                min: 0,
                max: globalMax,
                axisLabel: { color: '#555', fontSize: 16, formatter: v => (v/1000).toFixed(0)+'k' },
                splitLine: { lineStyle: { color: '#eee' } }
            },
            yAxis: {
                type: 'category',
                data: countries,
                axisLabel: { color: '#333', fontSize: 16 },
                axisLine: { lineStyle: { color: '#ddd' } },
                axisTick: { show: false }
            },
            series: [
                {
                    name: '保留',
                    type: 'bar', stack: 'total', barMaxWidth: 14,
                    // 系列级 color 供 legend 取色；数据项 itemStyle 会覆盖柱子本身
                    itemStyle: { color: '#3ba562' },
                        data: base.map(v => ({ value: v, itemStyle: { color: '#3ba562' } }))
                },
                {
                    name: '增加',
                    type: 'bar', stack: 'total', barMaxWidth: 14,
                    itemStyle: { color: '#31d86e' },
                    data: gains.map(v => ({ value: v, itemStyle: { color: '#31d86e' } })),
                    // 16px 的数值放不下时宁可不画：明细看 tooltip
                    labelLayout: { hideOverlap: true },
                    label: {
                        show: true, position: 'right', fontSize: 16, color: '#1a7a3a',
                        formatter: p => p.value > 0 ? '+' + p.value.toLocaleString() : ''
                    }
                },
                {
                    name: '减少',
                    type: 'bar', stack: 'total', barMaxWidth: 14,
                    itemStyle: { color: stripePattern },
                    data: losses.map(v => ({ value: v, itemStyle: { color: stripePattern } })),
                    labelLayout: { hideOverlap: true },
                    label: {
                        show: true, position: 'right', fontSize: 16, color: '#6b7280',
                        formatter: p => p.value > 0 ? '-' + p.value.toLocaleString() : ''
                    }
                }
            ]
        });
        window.addEventListener('resize', () => chart.resize());
    });
}
</script>
</body>
</html>
